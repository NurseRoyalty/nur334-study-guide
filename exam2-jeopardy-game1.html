    <script>
        const JEOPARDY_EXAM2_GAME1 = {
            categories: [
                {
                    id: "sodium-imbalances",
                    name: "Sodium Imbalances",
                    clues: {
                        100: [{ q: "A 78-year-old patient with SIADH presents with serum sodium 122 mEq/L, confusion, and inability to concentrate. Which nursing action is the PRIORITY?", a: "Implement seizure precautions and maintain fluid restrictions; monitor sodium levels closely", rationale: "Hyponatremia causes cerebral edema affecting cell size in the brain, resulting in mental status changes and seizure risk. Fluid restriction concentrates serum sodium. Seizure precautions are critical because Na <120 can cause seizures. Sodium must be corrected slowly (8 mEq/L per 24 hours) to avoid osmotic demyelination syndrome." }],
                        200: [{ q: "A patient on diuretics with diarrhea and vomiting has serum sodium 128 mEq/L, reports weakness and dizziness when standing, with BP 90/58 lying down and 80/50 standing. What type of hyponatremia-related problem is this patient experiencing?", a: "Hyponatremia WITH extracellular fluid volume deficit (hypovolemic hyponatremia)", rationale: "The combination of low sodium, postural hypotension, orthostatic symptoms, and low blood pressure indicates ECF volume loss. Patients lose both sodium AND water (diarrhea, vomiting), but lose MORE sodium proportionally. Treatment involves both sodium AND fluid replacement—not fluid restriction. This differs from SIADH where fluid restriction is treatment." }],
                        300: [{ q: "A 65-year-old with uncontrolled diabetes mellitus develops polyuria and polydipsia but doesn't drink enough water due to altered mental status. Serum sodium is 152 mEq/L and serum osmolality is very high. Which physiologic mechanism is primary?", a: "Excessive water loss through osmotic diuresis from hyperglycemia; inadequate free water intake leads to hypernatremia", rationale: "High glucose creates osmotic diuresis (kidney loses more water than sodium). If free water intake is inadequate (due to confusion, thirst mechanism loss in elderly, etc.), sodium concentration increases. Osmolality is determined by sodium particles, so high sodium = high osmolality. Treatment requires hypotonic fluids (D5W or 0.45% saline) plus fluid replacement." }],
                        400: [{ q: "A 70-year-old on furosemide for heart failure presents with confusion, weakness, and serum sodium 120 mEq/L. Urine osmolality is high (600 mOsm/kg) and urine sodium is low (15 mEq/L). What is the likely cause?", a: "SIADH (syndrome of inappropriate antidiuretic hormone) with hypovolemic component from diuretic use", rationale: "High urine osmolality + low urine sodium + hyponatremia = SIADH pattern. The diuretic causes fluid/sodium loss, but ADH inappropriately concentrates urine further, worsening hyponatremia. This is common in older adults, especially on certain medications. Treatment is fluid restriction (not saline, which would cause kidney to excrete more water due to high ADH)." }],
                        500: [{ q: "A patient with cirrhosis develops ascites and hyponatremia (Na 118 mEq/L) with edema and elevated JVD. Urine sodium is <5 mEq/L. IV fluids with normal saline are ordered but seem to worsen the ascites and edema. Which mechanism explains this paradox?", a: "Severe portal hypertension and renal hypoperfusion trigger intense ADH and aldosterone secretion; kidneys interpret low BP (despite edema) as volume depletion, reabsorbing sodium and water excessively", rationale: "In cirrhosis, portal hypertension causes splanchnic vasodilation and effective hypovolemia despite total body fluid excess. The kidney responds with SIADH and secondary hyperaldosteronism. Normal saline is reabsorbed almost completely because kidneys 'think' they're volume-depleted. The ascites/edema worsen. Treatment requires fluid restriction, spironolactone, and sometimes hypertonic saline with loop diuretics—not routine IV fluids." }]
                    }
                },
                {
                    id: "potassium-imbalances",
                    name: "Potassium Imbalances",
                    clues: {
                        100: [{ q: "A patient with acute renal failure has serum potassium 6.8 mEq/L and EKG shows peaked T waves and widened QRS complex. What is the FIRST intervention?", a: "Give IV calcium gluconate to stabilize the cardiac membrane and reduce risk of dysrhythmias", rationale: "Severe hyperkalemia with EKG changes is a CARDIAC EMERGENCY. Calcium does NOT lower potassium but STABILIZES the myocardium, buying time for potassium-lowering interventions (insulin + glucose, beta-agonists, diuretics, dialysis). This is why calcium is FIRST—it prevents fatal dysrhythmias immediately." }],
                        200: [{ q: "A patient with DKA has initially normal potassium (4.5 mEq/L) but looks very ill with weakness. After insulin and IV fluids are started, potassium suddenly drops to 2.8 mEq/L and the patient develops peaked P waves. What happened?", a: "Insulin shifts potassium INTO cells; in DKA, initial hypokalemia is MASKED by acidosis (which shifts K OUT of cells), so total body K deficit is large", rationale: "In DKA, acidosis causes potassium to leave cells (H+ replaces K+), so serum K looks normal despite severe TOTAL BODY K depletion. When insulin and bicarb are given, potassium shifts back INTO cells, unmasking the deficit. This is why DKA patients receive potassium replacement even if initial K is normal. Failure to replace causes severe hypokalemia and dysrhythmias." }],
                        300: [{ q: "A patient with severe burns has rhabdomyolysis and acute kidney injury with serum potassium 7.5 mEq/L. Which intervention MUST be avoided?", a: "IV bolus of normal saline alone without concurrent potassium-lowering therapy; this volume expands but does not address hyperkalemia and delays treatment", rationale: "Rhabdomyolysis releases massive potassium from damaged muscles. Burns cause tissue breakdown (more K release) and AKI (no excretion). A provider might order fluids to 'flush kidneys,' but volume alone won't lower K. This patient needs: calcium (stabilize), insulin + glucose (shift K in), dialysis (remove K), and possibly loop diuretics IF kidneys producing some urine. Fluid alone is inadequate." }],
                        400: [{ q: "A 62-year-old on enalapril (ACE inhibitor) for hypertension and spironolactone for heart failure presents with serum potassium 6.9 mEq/L and creatinine 2.1 mg/dL (elevated). EKG shows peaked T waves. Which factor MOST contributed to this hyperkalemia?", a: "Declining renal function (elevated creatinine) combined with medications that reduce potassium excretion (both ACE inhibitor and spironolactone)", rationale: "The kidneys are the MAJOR route for potassium excretion. When renal function declines (indicated by elevated creatinine), potassium accumulates. ACE inhibitors decrease aldosterone (reduces K excretion); spironolactone blocks aldosterone directly. Together with reduced GFR, this creates a 'triple threat.' Treatment involves holding or reducing one medication AND possibly emergency dialysis if K >7.0 with EKG changes." }],
                        500: [{ q: "A patient with hyperkalemia (K 7.1) is given insulin 10 units IV with dextrose, and calcium gluconate IV for cardiac protection. After 30 minutes, potassium is still 6.9. Why hasn't it dropped more, and what's the next step?", a: "Insulin/glucose and calcium are temporary measures (K shifted partially into cells); if kidney disease is cause and K remains dangerously high, emergent dialysis is needed to REMOVE potassium from body", rationale: "Insulin/glucose, bicarbonate, beta-agonists, and calcium all shift K transiently or protect the heart, but none REMOVE K from the body. Only dialysis, diuretics (if kidneys working), and cation-exchange resins (Kayexalate) actually remove K. With kidney disease, diuretics won't work. Emergent dialysis is indicated for K >7.0 with EKG changes that persist despite interventions." }]
                    }
                },
                {
                    id: "fluid-balance",
                    name: "Fluid Balance & Osmolality",
                    clues: {
                        100: [{ q: "A 35-year-old healthy patient has serum osmolality 290 mOsm/kg and serum sodium 142 mEq/L. Is this patient hypertonic, isotonic, or hypotonic?", a: "Isotonic; osmolality is normal (280-295 mOsm/kg), indicating normal concentration of particles/solution", rationale: "Osmolality reflects concentration of particles in solution. Normal is 280-295 mOsm/kg. Sodium is the major contributor to serum osmolality (accounts for most particles). When osmolality is normal, it's isotonic—cells are in equilibrium, neither swollen nor shriveled. Understanding osmolality is critical for understanding fluid imbalances." }],
                        200: [{ q: "A patient with severe vomiting and diarrhea has serum sodium 148 mEq/L, osmolality 315 mOsm/kg, and is extremely thirsty. Why is the thirst mechanism activated despite fluid loss?", a: "Hypertonic/hyperosmolar state triggers osmoreceptors in hypothalamus; thirst increases water intake to dilute high osmolality back to normal", rationale: "Osmoreceptors detect high osmolality (too many particles, too concentrated). Thirst is a protective mechanism—increased fluid intake dilutes the solution. This is why healthy people don't usually develop severe hypernatremia—thirst prevents it. However, elderly, intubated, or altered patients can't respond to thirst and become dangerously hypernatremic." }],
                        300: [{ q: "A patient with heart failure on furosemide shows signs of dehydration (tachycardia, orthostasis) with serum sodium 138 mEq/L and osmolality 290 mOsm/kg. Why does this patient need careful fluid replacement, not just more diuretics?", a: "Serum sodium and osmolality are normal, but TOTAL BODY SODIUM is depleted; giving more diuretics causes further loss; isotonic fluids (0.9% saline) are needed to restore intravascular volume", rationale: "This is a subtle point: serum sodium can be normal even with total body sodium deficit if water loss is proportional. However, clinical signs (orthostasis, tachycardia) indicate hypovolemia. In heart failure, reducing diuretics and giving isotonic saline may be needed briefly to restore perfusion, then resume diuretics. Always assess total body status, not just serum value." }],
                        400: [{ q: "A patient with cirrhosis develops hepatic encephalopathy with elevated ammonia, disorientation, and serum sodium 120 mEq/L. IV hypertonic saline (3%) is ordered. How can saline help hepatic encephalopathy when the primary problem is ammonia?", a: "Hypertonic saline raises osmolality, drawing fluid OUT of cells including brain cells; this reduces cerebral edema from hyponatremia AND may improve mental status by reducing brain swelling independent of ammonia levels", rationale: "In cirrhosis, hepatic encephalopathy is multifactorial: high ammonia, hyponatremia with cerebral edema, elevated inflammatory mediators. Hypertonic saline addresses the hyponatremia and cerebral edema component, improving some mental status changes. It's not a cure for ammonia toxicity, but it's a useful adjunct. Lactulose addresses ammonia." }],
                        500: [{ q: "A patient with severe hyponatremia (Na 108 mEq/L) and symptomatic cerebral edema requiring hypertonic saline is corrected at 4 mEq/L per hour. By hour 6, the patient's mental status worsens despite rising serum sodium. An MRI shows pontine myelinolysis. What occurred?", a: "Osmotic demyelination syndrome (ODS/central pontine myelinolysis) from overly rapid sodium correction; myelin sheaths in pons damaged as water shifted out of cells too fast", rationale: "This is a tragic but real complication. While symptomatic hyponatremia requires urgent treatment, OVERLY RAPID correction (>8-10 mEq/L per 24 hours) causes ODS. The brain's myelin is damaged by osmotic stress. Once ODS occurs, it's irreversible. This is why sodium correction must be carefully monitored and titrated, even in symptomatic cases. Maximum safe correction is 8-10 mEq/L per 24 hours." }]
                    }
                },
                {
                    id: "blood-transfusion",
                    name: "Blood Components & Transfusion",
                    clues: {
                        100: [{ q: "A patient receiving a blood transfusion suddenly develops fever (103.2°F), chills, and mild dyspnea. Vital signs are stable otherwise. What is the most likely reaction, and what is the FIRST nursing action?", a: "Febrile nonhemolytic transfusion reaction (FNHTR); STOP the transfusion, keep IV patent, notify provider, obtain blood cultures, monitor closely", rationale: "FNHTR is most common acute transfusion reaction (1-2% of RBC transfusions). Caused by WBC/cytokine reaction. Fever is hallmark but no hemoglobinuria, jaundice, or severe symptoms. STOP transfusion first (always), but FNHTR usually resolves with acetaminophen; transfusion can often resume with slower rate after fever control. Distinguish from hemolytic reaction (also has fever but WITH hemoglobinuria, flank pain, hypotension)." }],
                        200: [{ q: "A patient receives FFP (fresh frozen plasma) for DIC and develops sudden onset dyspnea, hypoxia (O2 sat 89%), bilateral crackles on auscultation, and pink frothy sputum. What reaction is this?", a: "Transfusion-related acute lung injury (TRALI); immune/nonimmune mechanism causing capillary leak in lungs, pulmonary edema, respiratory distress", rationale: "TRALI is rare but serious. Occurs within 1-6 hours of transfusion. Symptoms: acute dyspnea, hypoxia, pulmonary edema (pink frothy sputum), fever, hypotension possible. No prior sensitization needed. Mechanism: WBC or plasma proteins cause endothelial injury. TREATMENT: STOP transfusion, oxygen, possibly mechanical ventilation, supportive care. Most resolve in 96 hours. Mortality ~5-10%." }],
                        300: [{ q: "A post-operative patient has hemoglobin 8.2 g/dL and is asymptomatic with normal vital signs. The provider orders 2 units of RBCs. The patient asks, 'Do I really need this transfusion?' What is an appropriate response?", a: "In stable, asymptomatic patients, transfusion triggers of 7-9 g/dL are now recommended; restrictive transfusion (lower Hgb threshold) has better outcomes than liberal transfusion in many patients", rationale: "Modern evidence shows restrictive transfusion strategies (hemoglobin threshold 7-8 g/dL) are as effective or better than liberal strategies (10+ g/dL) for most patients. Transfusions carry risks: transfusion reactions, infection, immune sensitization, volume overload. Unless symptomatic (chest pain, severe dyspnea) or in specific populations (acute MI, sepsis), lower Hgb is tolerated. This represents a major shift in practice." }],
                        400: [{ q: "A patient with massive trauma receives 6 units of RBCs, 3 units of FFP, and platelets rapidly. Despite correction of coagulopathy labs, the patient continues bleeding. Temperature drops to 96.1°F. Which complication is most important to address?", a: "Hypothermia from massive cold transfusion and dilutional coagulopathy; warm the patient to restore platelet function and coagulation factor activity", rationale: "In massive transfusion (>10 units in 24 hours), hypothermia is common (blood is cold). Hypothermia causes coagulopathy independent of factor dilution: platelet dysfunction, slowed enzyme kinetics, impaired thrombin generation. Even when labs 'look corrected,' cold patients still don't clot. Warming is critical. Modern massive transfusion protocols (MTP) emphasize 1:1:1 RBC:FFP:platelets ratio, damage control surgery, and aggressive warming." }],
                        500: [{ q: "A patient with a history of multiple transfusions and complicated deliveries develops severe anemia (Hgb 6.2) with negative direct antiglobulin test (DAT/Coombs) but positive indirect Coombs test. Why does this patient face transfusion challenges?", a: "Positive indirect Coombs indicates alloimmunization (antibodies to donor RBC antigens); this patient may have multiple RBC antibodies, requiring crossmatch-compatible, antigen-negative units or may require blood bank consultation for rare phenotype matching", rationale: "Alloimmunization develops in ~1-5% of chronically transfused patients. Antibodies form to minor RBC antigens (Kell, Duffy, Kidd, S/s, etc.) from repeated exposure to donor blood. Positive indirect Coombs (but negative DAT) indicates alloimmunization—patient has circulating antibodies. Finding compatible blood becomes difficult; may require antigen-matched units or rare donor registries. This is why minimizing unnecessary transfusions is important." }]
                    }
                },
                {
                    id: "anemia-types",
                    name: "Anemias & Lab Diagnostics",
                    clues: {
                        100: [{ q: "A 45-year-old with history of heavy menstrual bleeding presents with fatigue, dyspnea on exertion, pallor, and tachycardia. CBC shows: Hgb 7.8 g/dL, MCV 68 fL, RDW 18%. What type of anemia is this?", a: "Iron deficiency anemia; microcytic (MCV <80), hypochromic, with elevated RDW indicating varying cell sizes", rationale: "Iron deficiency is the most common anemia worldwide. Classic presentation: chronic blood loss (heavy menses) → depleted iron stores → microcytic/hypochromic RBCs. MCV <80 is microcytic; low MCHC is hypochromic. Elevated RDW means cells vary in size—some are very small (depleted), others less so. CBC pattern is pathognomonic. Next step: iron studies (ferritin, TIBC, serum iron)." }],
                        200: [{ q: "A 35-year-old African American with known sickle cell disease presents with severe pain in legs, back, and chest. CBC shows Hgb 8.1 g/dL (baseline is 8.5), WBC 18,000, platelets 350,000, reticulocyte count 15%. What is occurring?", a: "Vaso-occlusive crisis from sickle hemoglobin S; severe pain from tissue infarction; elevated WBC (stress response), high reticulocytes (hemolysis trigger), normal-high platelets", rationale: "Sickle cell disease: HbS polymerizes under low oxygen, causing RBC sickling and vaso-occlusion. Acute crisis presents with severe pain (infarction), fever sometimes, elevated WBC (physiologic stress). High reticulocytes indicate ongoing hemolysis. Baseline Hgb is low (chronic hemolytic anemia); Hgb dropping further during crisis indicates hemolysis acceleration. Treatment: oxygen, hydration, analgesia, antibiotics if infection." }],
                        300: [{ q: "A 52-year-old presents with progressive fatigue, difficulty concentrating, paresthesias in feet, and ataxia. CBC: Hgb 8.8, MCV 108 fL. B12 level is 210 pg/mL (low-normal, normal >200). Folate level is normal. What is the most likely diagnosis?", a: "Early B12 deficiency (pernicious anemia or dietary); despite borderline B12 level, neurologic symptoms are classic for B12 deficiency; methylmalonic acid and homocysteine levels would be elevated", rationale: "B12 deficiency has two phases: early (depleted stores, serum B12 dropping) and late (neurologic manifestations). Neurologic symptoms (paresthesias, ataxia, cognitive changes) indicate myelin damage from B12 deficiency. Serum B12 <300 is suspicious; neuro symptoms at 'normal' B12 are rare but occur in early deficiency. Methylmalonic acid and homocysteine (B12 cofactors) rise before B12 drops significantly. This patient needs B12 supplementation." }],
                        400: [{ q: "A 40-year-old with CKD Stage 3b presents with Hgb 8.9 g/dL, MCV 89 fL (normocytic), reticulocyte count 0.8% (low), iron studies normal. EPO level is low. What is the mechanism of anemia?", a: "Anemia of chronic kidney disease (anemia of chronic disease); kidneys produce insufficient erythropoietin (EPO), resulting in inadequate RBC production despite normal iron", rationale: "CKD causes anemia through EPO deficiency (kidney produces <90% of EPO). Unlike iron deficiency (microcytic) or B12 deficiency (macrocytic), this is normocytic with LOW reticulocyte count (bone marrow unresponsive). Iron studies are normal. Treatment: ESA (erythropoiesis-stimulating agents like epoetin alfa) with iron supplementation. Must monitor Hgb and hemoglobin target carefully." }],
                        500: [{ q: "A 67-year-old with newly diagnosed anemia has Hgb 8.1 g/dL, MCV 92 fL, reticulocyte count 0.6%, ferritin 420 ng/mL (elevated), and iron saturation 78% (very high). A bone marrow biopsy shows myelodysplastic changes with ringed sideroblasts. What diagnosis explains these findings?", a: "Myelodysplastic syndrome (MDS), specifically sideroblastic anemia subtype; abnormal iron metabolism in mitochondria causes iron accumulation in RBC precursors; ineffective erythropoiesis", rationale: "MDS is clonal disorder of bone marrow with dysplastic changes. Sideroblastic anemia (ringed sideroblasts on bone marrow) has iron-loading problem: mitochondrial enzyme deficiency prevents normal iron incorporation into heme, so iron accumulates. Presents with anemia + elevated iron studies (paradoxical!). Ineffective erythropoiesis = low reticulocytes despite marrow activity. Treatment: supportive transfusions, possibly ESAs, luspatercept, or hypomethylating agents." }]
                    }
                },
                {
                    id: "perioperative",
                    name: "Perioperative Nursing",
                    clues: {
                        100: [{ q: "A patient scheduled for major abdominal surgery reports taking ibuprofen daily for arthritis pain. The anesthesiologist wants to stop NSAIDs 5 days before surgery. Why?", a: "NSAIDs inhibit platelet aggregation and prolong bleeding time; discontinuation 5-7 days before surgery restores normal platelet function and reduces perioperative bleeding risk", rationale: "NSAIDs irreversibly inhibit cyclooxygenase (COX), blocking thromboxane A2 production needed for platelet aggregation. Unlike warfarin (needs reversal), NSAID effects wear off as new platelets are produced (takes 5-7 days). Same principle applies to aspirin. This is high-yield NCLEX content: medications affecting coagulation." }],
                        200: [{ q: "In the operating room, a patient has baseline blood pressure 145/88, heart rate 82. After induction with propofol, BP drops to 98/60 and HR increases to 110. What is this reaction?", a: "Expected pharmacologic effect of propofol: direct vasodilation and negative inotropic effect causing hypotension and reflex tachycardia; quickly managed with IV fluids and possible vasopressors", rationale: "Propofol is potent IV induction agent with known hypotensive effect (vasodilation + decreased contractility). This is expected, not an adverse event, though it must be managed. Anesthesiologist typically has IV fluids running and is prepared with vasopressors. This is different from anaphylaxis or malignant hyperthermia (which are true emergencies)." }],
                        300: [{ q: "A patient extubated after general anesthesia suddenly becomes agitated, combative, and disoriented in PACU (post-anesthesia care unit). Vital signs: BP 155/92, HR 124, RR 24. Oxygen sat 94% on 4L. What is the MOST LIKELY cause?", a: "Emergence delirium (emergence agitation); can be triggered by pain, full bladder, hypoxia, hypercarbia, or medications; must rule out hypoxia/hypercarbia first", rationale: "Emergence delirium/agitation is relatively common post-extubation. Causes: inadequately treated pain, urinary retention, hypoxia, hypercarbia (retained CO2), certain anesthetics. FIRST action: ensure adequate oxygenation (check SpO2, capnography if available), assess pain, check bladder (urinary catheter if needed), reorient patient. If hypoxia/pain/retention ruled out, may need mild sedation." }],
                        400: [{ q: "A patient with central sleep apnea is scheduled for knee surgery under general anesthesia. The anesthesiologist plans to use remifentanil (synthetic opioid) for anesthesia. What concern should be raised?", a: "Opioids depress respiratory drive; patient with sleep apnea has baseline CO2 retention risk; remifentanil will further suppress breathing, increasing post-operative respiratory depression and hypoxemia risk", rationale: "Opioids depress the respiratory center in medulla. Patients with sleep apnea already have impaired breathing control/CO2 response. Adding opioids worsens hypoventilation. Post-operatively, pain may necessitate more opioids, creating vicious cycle. Management: cautious opioid dosing, multimodal analgesia (NSAIDs, regional blocks), vigilant monitoring, possibly overnight ICU observation, CPAP use post-op." }],
                        500: [{ q: "Intra-operatively, patient develops sudden sustained muscle rigidity, rapidly rising core temperature (39.2°C), dark urine, hyperkalemia (7.1), and severe metabolic acidosis. Capnography shows sharply rising end-tidal CO2. What is this life-threatening emergency?", a: "Malignant hyperthermia (MH); pharmacogenetic response to volatile anesthetics and/or succinylcholine; muscle rigidity, uncontrolled heat production, rhabdomyolysis, hyperkalemia, and acidosis", rationale: "MH is rare (~1:3000-5000) but FATAL if untreated. Mechanism: defective calcium regulation in sarcoplasmic reticulum → uncontrolled muscle contraction/heat. Signs: sustained muscle rigidity, rising temp (late sign), rising ETCO2 (early, from hypermetabolism), dark urine (myoglobinuria from rhabdomyolysis), hyperkalemia, acidosis. IMMEDIATE: stop triggering agents, switch to non-trigger anesthetic, hyperventilate with 100% O2, GIVE DANTROLENE IV." }]
                    }
                }
            ]
        };

        let player1Score = 0;
        let player2Score = 0;
        let answeredClues = new Set();
        let currentCategory = null;
        let currentPoints = null;

        function initializeGame() {
            loadScores();
            loadAnsweredClues();
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'categories-grid';

            Object.keys(JEOPARDY_EXAM2_GAME1.categories).forEach(idx => {
                const category = JEOPARDY_EXAM2_GAME1.categories[idx];
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'category-name';
                nameDiv.textContent = category.name;
                categoryDiv.appendChild(nameDiv);
                const pointsGridDiv = document.createElement('div');
                pointsGridDiv.className = 'points-grid';
                [100, 200, 300, 400, 500].forEach(points => {
                    if (category.clues[points] && category.clues[points].length > 0) {
                        const clueKey = category.id + '-' + points;
                        const cellDiv = document.createElement('div');
                        cellDiv.className = 'point-cell';
                        cellDiv.textContent = points + ' pts';
                        if (answeredClues.has(clueKey)) {
                            cellDiv.classList.add('answered');
                        } else {
                            cellDiv.onclick = () => openQuestion(idx, points);
                        }
                        pointsGridDiv.appendChild(cellDiv);
                    }
                });
                categoryDiv.appendChild(pointsGridDiv);
                grid.appendChild(categoryDiv);
            });
            board.appendChild(grid);
        }

        function openQuestion(categoryIdx, points) {
            const category = JEOPARDY_EXAM2_GAME1.categories[categoryIdx];
            currentCategory = category.id;
            currentPoints = points;
            const clues = category.clues[points];
            if (!clues || clues.length === 0) return;
            const clue = clues[0];
            document.getElementById('modalTitle').textContent = category.name + ' - ' + points + ' pts';
            document.getElementById('questionText').textContent = clue.q;
            document.getElementById('answerText').textContent = clue.a;
            document.getElementById('rationaleText').textContent = clue.rationale;
            document.getElementById('answerSection').style.display = 'none';
            document.getElementById('scoreButtons').style.display = 'none';
            document.getElementById('revealBtn').style.display = 'block';
            document.getElementById('questionModal').style.display = 'block';
        }

        function awardPoints(player) {
            if (player === 1) player1Score += currentPoints;
            else player2Score += currentPoints;
            markClueAnswered();
            saveScores();
            updateScoreDisplay();
            closeModal();
        }

        function skipQuestion() {
            markClueAnswered();
            closeModal();
        }

        function markClueAnswered() {
            answeredClues.add(currentCategory + '-' + currentPoints);
            saveAnsweredClues();
            renderBoard();
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            currentCategory = null;
            currentPoints = null;
        }

        function revealAnswer() {
            document.getElementById('answerSection').style.display = 'block';
            document.getElementById('scoreButtons').style.display = 'flex';
            document.getElementById('revealBtn').style.display = 'none';
        }

        function updateScoreDisplay() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function saveScores() {
            localStorage.setItem('exam2-game1-scores-1', player1Score.toString());
            localStorage.setItem('exam2-game1-scores-2', player2Score.toString());
        }

        function loadScores() {
            player1Score = parseInt(localStorage.getItem('exam2-game1-scores-1') || '0');
            player2Score = parseInt(localStorage.getItem('exam2-game1-scores-2') || '0');
            updateScoreDisplay();
        }

        function saveAnsweredClues() {
            localStorage.setItem('exam2-game1-answered-clues', JSON.stringify(Array.from(answeredClues)));
        }

        function loadAnsweredClues() {
            const saved = localStorage.getItem('exam2-game1-answered-clues');
            if (saved) answeredClues = new Set(JSON.parse(saved));
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('exam2-game1-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function practiceAgain() {
            answeredClues.clear();
            saveAnsweredClues();
            renderBoard();
            closeModal();
        }

        function newGame() {
            if (confirm('Start a new game? Scores will reset.')) {
                player1Score = 0;
                player2Score = 0;
                answeredClues.clear();
                saveScores();
                saveAnsweredClues();
                updateScoreDisplay();
                renderBoard();
                closeModal();
            }
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('questionModal')) closeModal();
        };

        window.addEventListener('load', function() {
            if (localStorage.getItem('exam2-game1-theme') === 'light') document.body.classList.add('light-theme');
            initializeGame();
        });
    </script>
</body>
</html>
