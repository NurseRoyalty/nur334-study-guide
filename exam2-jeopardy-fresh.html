<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy - NCLEX-NGN Clinical Judgment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --accent-blue: #0f3460;
            --accent-gold: #e94560;
            --button-hover: #528aff;
            --border-color: #404040;
        }

        body.light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #333333;
            --accent-blue: #0f3460;
            --accent-gold: #e94560;
            --button-hover: #528aff;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-gold));
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95em;
        }

        .nav-link:hover {
            color: var(--accent-gold);
        }

        .theme-toggle {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--button-hover);
        }

        .scores {
            display: flex;
            gap: 30px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .score-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .score-value {
            color: var(--accent-gold);
            font-size: 1.3em;
        }

        .game-container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .category {
            background-color: var(--accent-blue);
            border: 3px solid var(--accent-gold);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .category-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .points-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .point-cell {
            background-color: var(--accent-gold);
            color: #000;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .point-cell:hover:not(.answered) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        .point-cell.answered {
            background-color: #666;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: var(--bg-primary);
            margin: 10% auto;
            padding: 30px;
            border: 3px solid var(--accent-gold);
            border-radius: 10px;
            width: 85%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 15px;
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--accent-gold);
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--button-hover);
        }

        .question-section {
            margin-bottom: 25px;
        }

        .section-label {
            font-size: 0.9em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .question-text {
            background-color: var(--bg-secondary);
            padding: 15px;
            border-radius: 6px;
            font-size: 1.05em;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .reveal-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: 2px solid #000;
            padding: 14px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 20px;
        }

        .reveal-btn:hover {
            background-color: #ff6b81;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }

        .answer-section {
            display: none;
            animation: slideDown 0.4s;
        }

        .answer-section.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-text {
            background-color: var(--accent-gold);
            color: #000;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .rationale-text {
            background-color: var(--bg-secondary);
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-gold);
            font-style: italic;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .score-display {
            display: none;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .score-btn {
            background-color: var(--accent-blue);
            color: white;
            border: 2px solid var(--accent-gold);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .score-btn:hover {
            background-color: var(--button-hover);
        }

        .score-btn.active {
            background-color: var(--accent-gold);
            color: #000;
        }

        .close-modal-btn {
            background-color: var(--accent-blue);
            color: white;
            border: 2px solid var(--accent-gold);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
            width: 100%;
        }

        .close-modal-btn:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .categories-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .points-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .modal-content {
                width: 95%;
                margin: 20% auto;
                padding: 20px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .scores {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎯 NUR334 Exam 2 Jeopardy</h1>
        <p>NCLEX-NGN Clinical Judgment - Week 2 (Hematology) & Week 3 (Electrolytes/Perioperative)</p>
    </header>

    <div class="controls">
        <a href="index.html" class="nav-link">← Back to Home</a>
        <div class="scores">
            <div class="score-item">
                <span>Player 1:</span>
                <span class="score-value" id="player1Score">0</span>
            </div>
            <div class="score-item">
                <span>Player 2:</span>
                <span class="score-value" id="player2Score">0</span>
            </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark/Light</button>
    </div>

    <div class="game-container">
        <div id="gameBoard"></div>
    </div>

    <div id="questionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Question</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div class="question-section">
                <div class="section-label">Question</div>
                <div class="question-text" id="questionText"></div>
            </div>

            <button class="reveal-btn" id="revealBtn" onclick="toggleAnswer()">Reveal Answer</button>

            <div class="answer-section" id="answerSection">
                <div class="section-label">Answer</div>
                <div class="answer-text" id="answerText"></div>

                <div class="section-label">Rationale (NCLEX-NGN Focus)</div>
                <div class="rationale-text" id="rationaleText"></div>
            </div>

            <div class="score-display" id="scoreDisplay">
                <button class="score-btn active" onclick="awardPoints(1)">Player 1 Correct</button>
                <button class="score-btn" onclick="awardPoints(2)">Player 2 Correct</button>
                <button class="score-btn" onclick="skipQuestion()">Skip/No Points</button>
            </div>

            <button class="close-modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="exam2-jeopardy-bank.js"></script>
    <script>
        let currentCategory = null;
        let currentPoints = null;
        let player1Score = 0;
        let player2Score = 0;
        let answeredClues = new Set();

        function initializeGame() {
            loadScores();
            loadAnsweredClues();
            randomizeCategories();
            renderBoard();
        }

        function randomizeCategories() {
            const allCategories = window.JEOPARDY_EXAM2.categories;
            const week2 = allCategories.filter(c => c.source === 'Week 2');
            const week3 = allCategories.filter(c => c.source === 'Week 3');

            const selectedWeek2 = week2.sort(() => Math.random() - 0.5).slice(0, 3);
            const selectedWeek3 = week3.sort(() => Math.random() - 0.5).slice(0, 3);

            window.JEOPARDY_EXAM2.selectedCategories = [...selectedWeek2, ...selectedWeek3];
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            const categories = window.JEOPARDY_EXAM2.selectedCategories;

            categories.forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'category-name';
                nameDiv.textContent = category.name;
                categoryDiv.appendChild(nameDiv);

                const pointsGridDiv = document.createElement('div');
                pointsGridDiv.className = 'points-grid';

                [100, 200, 300, 400, 500].forEach(points => {
                    const clueKey = `${category.id}-${points}`;
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'point-cell';
                    cellDiv.textContent = points + ' pts';

                    if (answeredClues.has(clueKey)) {
                        cellDiv.classList.add('answered');
                    } else {
                        cellDiv.onclick = () => openQuestion(category.id, points);
                    }

                    pointsGridDiv.appendChild(cellDiv);
                });

                categoryDiv.appendChild(pointsGridDiv);
                board.appendChild(categoryDiv);
            });
        }

        function openQuestion(categoryId, points) {
            currentCategory = categoryId;
            currentPoints = points;

            const category = window.JEOPARDY_EXAM2.selectedCategories.find(c => c.id === categoryId);
            if (!category) return;

            const clue = getRandomClue(category, points);
            if (!clue) return;

            document.getElementById('modalTitle').textContent = `${category.name} - ${points} pts`;
            document.getElementById('questionText').textContent = clue.q;
            document.getElementById('answerText').textContent = clue.a;
            document.getElementById('rationaleText').textContent = clue.rationale;
            document.getElementById('answerSection').classList.remove('show');
            document.getElementById('scoreDisplay').style.display = 'none';
            document.getElementById('revealBtn').textContent = 'Reveal Answer';
            document.getElementById('questionModal').style.display = 'block';
        }

        function getRandomClue(category, points) {
            const pointsStr = points.toString();
            const clues = category.clues[pointsStr];
            if (!clues || clues.length === 0) return null;
            return clues[Math.floor(Math.random() * clues.length)];
        }

        function toggleAnswer() {
            const answerSection = document.getElementById('answerSection');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const revealBtn = document.getElementById('revealBtn');

            if (answerSection.classList.contains('show')) {
                answerSection.classList.remove('show');
                scoreDisplay.style.display = 'none';
                revealBtn.textContent = 'Reveal Answer';
            } else {
                answerSection.classList.add('show');
                scoreDisplay.style.display = 'flex';
                revealBtn.textContent = 'Hide Answer';
            }
        }

        function awardPoints(player) {
            const points = currentPoints;
            if (player === 1) {
                player1Score += points;
            } else {
                player2Score += points;
            }

            markClueAnswered();
            saveScores();
            updateScoreDisplay();
            closeModal();
        }

        function skipQuestion() {
            markClueAnswered();
            closeModal();
        }

        function markClueAnswered() {
            const clueKey = `${currentCategory}-${currentPoints}`;
            answeredClues.add(clueKey);
            saveAnsweredClues();
            renderBoard();
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            currentCategory = null;
            currentPoints = null;
        }

        function updateScoreDisplay() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function saveScores() {
            localStorage.setItem('exam2-player1-score', player1Score.toString());
            localStorage.setItem('exam2-player2-score', player2Score.toString());
        }

        function loadScores() {
            player1Score = parseInt(localStorage.getItem('exam2-player1-score') || '0');
            player2Score = parseInt(localStorage.getItem('exam2-player2-score') || '0');
            updateScoreDisplay();
        }

        function saveAnsweredClues() {
            localStorage.setItem('exam2-answered-clues', JSON.stringify(Array.from(answeredClues)));
        }

        function loadAnsweredClues() {
            const saved = localStorage.getItem('exam2-answered-clues');
            if (saved) {
                answeredClues = new Set(JSON.parse(saved));
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('exam2-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('questionModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        window.addEventListener('load', function() {
            const savedTheme = localStorage.getItem('exam2-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
            initializeGame();
        });
    </script>
</body>
</html>
