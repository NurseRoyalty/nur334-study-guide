<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #ffffff;
            --accent-blue: #0f3460;
            --accent-gold: #e94560;
            --button-hover: #528aff;
        }
        body.light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { background: linear-gradient(135deg, var(--accent-blue), var(--accent-gold)); padding: 20px; text-align: center; }
        header h1 { font-size: 2.5em; margin-bottom: 5px; }
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--bg-secondary); gap: 10px; flex-wrap: wrap; }
        .theme-toggle { background-color: var(--accent-blue); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .theme-toggle:hover { background-color: var(--button-hover); }
        .scores { display: flex; gap: 30px; font-size: 1.1em; font-weight: bold; }
        .score-value { color: var(--accent-gold); font-size: 1.3em; }
        .game-container { flex: 1; padding: 30px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .category { background-color: var(--accent-blue); border: 3px solid var(--accent-gold); border-radius: 8px; padding: 15px; text-align: center; }
        .category-name { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .points-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .point-cell { background-color: var(--accent-gold); color: #000; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .point-cell:hover:not(.answered) { transform: scale(1.05); box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4); }
        .point-cell.answered { background-color: #666; color: #999; cursor: not-allowed; opacity: 0.6; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); }
        .modal-content { background-color: var(--bg-primary); margin: 10% auto; padding: 30px; border: 3px solid var(--accent-gold); border-radius: 10px; width: 85%; max-width: 800px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 15px; }
        .modal-title { font-size: 1.3em; font-weight: bold; color: var(--accent-gold); }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--accent-gold); }
        .question-section { margin-bottom: 25px; }
        .section-label { font-size: 0.9em; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        .question-text { background-color: var(--bg-secondary); padding: 15px; border-radius: 6px; font-size: 1.05em; line-height: 1.6; margin-bottom: 10px; }
        .answer-text { background-color: var(--accent-gold); color: #000; padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; line-height: 1.6; }
        .rationale-text { background-color: var(--bg-secondary); padding: 15px; border-radius: 6px; border-left: 4px solid var(--accent-gold); font-style: italic; line-height: 1.6; }
        .score-display { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .score-btn { background-color: var(--accent-blue); color: white; border: 2px solid var(--accent-gold); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .score-btn:hover { background-color: var(--button-hover); }
        .close-modal-btn { background-color: var(--accent-blue); color: white; border: 2px solid var(--accent-gold); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>🎯 NUR334 Exam 2 Jeopardy</h1>
        <p>NCLEX-NGN Clinical Judgment</p>
    </header>

    <div class="controls">
        <div class="scores">
            <div><span>Player 1:</span> <span class="score-value" id="player1Score">0</span></div>
            <div><span>Player 2:</span> <span class="score-value" id="player2Score">0</span></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark/Light</button>
    </div>

    <div class="game-container">
        <div id="gameBoard"></div>
    </div>

    <div id="questionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Question</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="question-section">
                <div class="section-label">Question</div>
                <div class="question-text" id="questionText"></div>
            </div>
            <div class="question-section">
                <div class="section-label">Answer</div>
                <div class="answer-text" id="answerText"></div>
                <div class="section-label">Rationale</div>
                <div class="rationale-text" id="rationaleText"></div>
            </div>
            <div class="score-display">
                <button class="score-btn" onclick="awardPoints(1)">Player 1 Correct</button>
                <button class="score-btn" onclick="awardPoints(2)">Player 2 Correct</button>
                <button class="score-btn" onclick="skipQuestion()">Skip</button>
            </div>
            <button class="close-modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const QUESTIONS = {
            "Hematology": {
                100: [
                    { q: "What does CBC stand for?", a: "Complete Blood Count", r: "The CBC measures RBCs, WBCs, platelets, hemoglobin, and hematocrit." },
                    { q: "Normal WBC count range?", a: "5,000-10,000 cells/microL", r: "Below this range is leukopenia; above is leukocytosis." },
                    { q: "Normal hemoglobin for adult females?", a: "12-16 g/dL", r: "Males run 13.5-17.5 g/dL; females are lower due to menstrual loss." },
                    { q: "Normal platelet count?", a: "150,000-400,000/microL", r: "Below 150,000 is thrombocytopenia; above 400,000 is thrombocytosis." },
                    { q: "What is the reticulocyte count used for?", a: "To assess bone marrow RBC production", r: "High retic count means marrow is working hard; low count signals bone marrow failure." }
                ],
                200: [
                    { q: "What does MCV stand for?", a: "Mean Corpuscular Volume", r: "Measures average size of RBCs - low = microcytic, high = macrocytic." },
                    { q: "What is the MCH?", a: "Mean Corpuscular Hemoglobin", r: "Measures average hemoglobin per RBC." },
                    { q: "What causes a left shift in WBC?", a: "Immature neutrophils released early from bone marrow", r: "Indicates acute infection or stress response." },
                    { q: "What does aPTT measure?", a: "Activated partial thromboplastin time", r: "Tests the intrinsic and common coagulation pathways." },
                    { q: "What is ferritin used for?", a: "To assess total body iron stores", r: "Low ferritin signals iron deficiency; high ferritin suggests iron overload." }
                ],
                300: [
                    { q: "What does a positive Coombs test indicate?", a: "Antibodies or complement bound to RBC surface", r: "Indicates immune-mediated hemolysis." },
                    { q: "What is the RETIC index?", a: "Reticulocyte count adjusted for degree of anemia", r: "High retic index in anemia shows marrow is responding." },
                    { q: "What does elevated LDH suggest in anemia?", a: "Hemolysis - RBC destruction", r: "LDH is released when RBCs break down." },
                    { q: "Why is haptoglobin low in hemolytic anemia?", a: "It binds to hemoglobin from lysed RBCs", r: "Haptoglobin is consumed binding free hemoglobin." },
                    { q: "What is PT/INR?", a: "Prothrombin time as International Normalized Ratio", r: "Standardized measure of extrinsic coagulation pathway." }
                ],
                400: [
                    { q: "What are schistocytes?", a: "Fragmented RBCs from mechanical damage", r: "Seen in microangiopathic hemolytic anemia and DIC." },
                    { q: "What does polychromasia indicate?", a: "Young RBCs (reticulocytes) present", r: "Blue-tinted appearance under microscope shows elevated retic count." },
                    { q: "What is the significance of elevated IPF?", a: "Increased platelet production by bone marrow", r: "Good sign that marrow is responding to platelet loss." },
                    { q: "What pattern in DIC coagulation studies?", a: "PT elevated, aPTT prolonged, platelets low, fibrinogen low", r: "DIC consumes clotting factors while activating fibrinolysis." },
                    { q: "What is transferrin saturation?", a: "(Serum iron / TIBC) x 100", r: "Normal 20-50%; low indicates iron deficiency." }
                ],
                500: [
                    { q: "What does flow cytometry reveal in leukemia?", a: "Abnormal cell populations with unusual antigen expression", r: "Confirms leukemia and identifies subtype." },
                    { q: "What is RDW?", a: "Red cell distribution width - measure of RBC size variation", r: "Elevated in iron deficiency and mixed RBC populations." },
                    { q: "What causes elevated MCV with low hemoglobin?", a: "Macrocytic anemia - likely B12 or folate deficiency", r: "Large cells from impaired DNA synthesis." },
                    { q: "Normal PT/INR with prolonged bleeding time suggests?", a: "Platelet problem, not clotting factor deficiency", r: "PT/aPTT test factors; bleeding time tests platelet function." },
                    { q: "What is bone marrow biopsy used for?", a: "To assess marrow cellularity and rule out marrow disease", r: "Direct visualization of marrow structure." }
                ]
            },
            "Anemias": {
                100: [
                    { q: "What is anemia's basic definition?", a: "Reduced number of RBCs or reduced hemoglobin", r: "Reduces oxygen-carrying capacity." },
                    { q: "Most common anemia in US?", a: "Iron deficiency anemia", r: "Highest in toddlers, adolescent girls, women of childbearing age." },
                    { q: "How long does a normal RBC live?", a: "About 120 days", r: "Balance between production and loss determines hemoglobin." },
                    { q: "Physical findings in iron deficiency?", a: "Glossitis, koilonychia (spoon nails), pica", r: "Iron-deficiency triad is specific to this anemia." },
                    { q: "Microcytic, hypochromic RBCs suggest?", a: "Iron deficiency anemia", r: "Small, pale cells can't carry enough oxygen." }
                ],
                200: [
                    { q: "What causes macrocytic anemia?", a: "B12 or folate deficiency", r: "Both needed for RBC DNA synthesis." },
                    { q: "Blood cell lines lost in aplastic anemia?", a: "RBCs, WBCs, and platelets", r: "Primary bone marrow failure." },
                    { q: "Normocytic anemia points to?", a: "Blood loss, sickle cell, or hemolytic anemia", r: "Normal size and color but reduced count." },
                    { q: "What is pernicious anemia?", a: "B12 deficiency from lack of intrinsic factor", r: "Autoimmune destruction of intrinsic factor-producing cells." },
                    { q: "Why neurologic symptoms in B12 but not folate deficiency?", a: "B12 essential for myelin; folate is not", r: "B12 neurologic damage is irreversible if untreated." }
                ],
                300: [
                    { q: "Three pathophysiologic mechanisms of anemia?", a: "Decreased production, increased loss, dilution", r: "Reticulocyte count differentiates these." },
                    { q: "Reticulocyte count classification?", a: "High retic = bleeding/hemolysis; low retic = marrow failure", r: "Most important test for anemia classification." },
                    { q: "What is autoimmune hemolytic anemia?", a: "Immune system attacks and destroys RBCs", r: "Positive direct Coombs test confirms diagnosis." },
                    { q: "Why do sickle RBCs cause hemolysis?", a: "Abnormal hemoglobin polymerizes and distorts RBCs into sickle shape", r: "They get stuck and rupture." },
                    { q: "G6PD deficiency triggers hemolysis when?", a: "When exposed to oxidative stressors (fava beans, drugs)", r: "X-linked, episodic hemolysis." }
                ],
                400: [
                    { q: "What is the RPI (reticulocyte production index)?", a: "Retic count corrected for anemia degree and RBC lifespan", r: "More accurate than raw retic for assessing marrow." },
                    { q: "Differentiate microcytic anemias?", a: "Iron deficiency (low ferritin) vs thalassemia vs sideroblastic", r: "Ferritin and hemoglobin electrophoresis help distinguish." },
                    { q: "Causes of macrocytic anemia?", a: "B12 deficiency, folate deficiency, medications, liver disease", r: "Distinguish by B12, folate levels and marrow biopsy." },
                    { q: "Acute vs chronic blood loss presentation?", a: "Acute: tachycardia, hypotension, shock risk; Chronic: gradual compensation", r: "Acute is medical emergency; chronic allows adaptation." },
                    { q: "Role of prednisone in AIHA?", a: "Suppresses antibody production and macrophage activity", r: "First-line therapy; IVIG is adjunctive." }
                ],
                500: [
                    { q: "Intrinsic vs extrinsic hemolytic anemia?", a: "Intrinsic: RBC defect; Extrinsic: immune attack or environmental", r: "Diagnosis uses DAT and morphology." },
                    { q: "When is bone marrow biopsy indicated?", a: "When diagnosis unclear or marrow failure suspected", r: "Directly assesses marrow cellularity and production." },
                    { q: "What is MAHA?", a: "Microangiopathic hemolytic anemia from RBC fragmentation", r: "Seen in TTP, HUS, DIC, prosthetic valves." },
                    { q: "Pathophysiology of sickle cell crisis?", a: "Hypoxia triggers HbS polymerization causing vaso-occlusion", r: "Managed with oxygen, hydration, analgesia." },
                    { q: "Anemia of chronic disease (ACD) iron pattern?", a: "Low serum iron, LOW TIBC (unlike iron deficiency with HIGH TIBC)", r: "Inflammation causes hepcidin-mediated iron sequestration." }
                ]
            },
            "Electrolytes": {
                100: [
                    { q: "Normal serum sodium range?", a: "136-145 mEq/L", r: "Major extracellular cation." },
                    { q: "Causes of hypernatremia?", a: "Water loss or sodium gain", r: "Causes cellular dehydration." },
                    { q: "Causes of hyponatremia?", a: "Water excess or sodium loss", r: "Causes cellular swelling and brain edema." },
                    { q: "Normal serum potassium?", a: "3.5-5.0 mEq/L", r: "Major intracellular cation." },
                    { q: "Cardiac effects of hyperkalemia?", a: "Peaked T waves, widened QRS, prolonged PR, cardiac arrest", r: "Medical emergency." }
                ],
                200: [
                    { q: "What is osmolality?", a: "Concentration of solutes per kg of solvent; normal 280-300", r: "Osmotic pressure drives water movement." },
                    { q: "What is SIADH?", a: "Excessive ADH causing water retention and hyponatremia", r: "Treat with fluid restriction." },
                    { q: "How does aldosterone regulate K and Na?", a: "Promotes Na reabsorption and K excretion", r: "ACE inhibitors/ARBs cause hyperkalemia risk." },
                    { q: "What is metabolic acidosis?", a: "pH <7.35 with low bicarbonate", r: "From acid gain or bicarbonate loss." },
                    { q: "What is metabolic alkalosis?", a: "pH >7.45 with high bicarbonate", r: "From acid loss or alkali gain." }
                ],
                300: [
                    { q: "How to treat hypernatremia?", a: "Replace water deficit slowly with hypotonic fluids", r: "Correct no faster than 8-10 mEq/L per day." },
                    { q: "How to treat hyponatremia?", a: "Fluid restriction, hypertonic saline for symptomatic, normal saline for volume depletion", r: "Correct slowly to avoid osmotic demyelination." },
                    { q: "How to treat hyperkalemia?", a: "Calcium gluconate, insulin/glucose, beta-agonists, diuretics, dialysis", r: "All except dialysis are temporary." },
                    { q: "Magnesium role in electrolytes?", a: "Required for Na-K-ATPase; deficiency causes K/Ca refractory to repletion", r: "Always repleted together." },
                    { q: "What is the anion gap?", a: "Na - (Cl + HCO3); normal 8-16", r: "Elevated suggests acid gain." }
                ],
                400: [
                    { q: "DKA acid-base pattern?", a: "Elevated anion gap metabolic acidosis from ketones", r: "Kussmaul respirations, fruity breath." },
                    { q: "What is lactic acidosis?", a: "Elevated lactate from tissue hypoxia", r: "High mortality condition." },
                    { q: "Respiratory acidosis compensation?", a: "Kidneys retain bicarbonate over days", r: "Acute onset is life-threatening." },
                    { q: "Respiratory alkalosis compensation?", a: "Kidneys excrete bicarbonate over days", r: "Often accompanies metabolic acidosis." },
                    { q: "How to identify mixed acid-base disorder?", a: "Check if respiratory/metabolic compensation is appropriate", r: "Expected compensation calculations reveal second disorder." }
                ],
                500: [
                    { q: "Chloride-responsive vs resistant alkalosis?", a: "Responsive: volume depletion, improves with saline; Resistant: hypokalemia, needs K", r: "Treatment differs based on type." },
                    { q: "What is osmotic demyelination syndrome?", a: "Neurologic complication from correcting hyponatremia too fast", r: "Prevent by slow correction." },
                    { q: "Role of phosphate in metabolism?", a: "Essential for ATP, DNA, RNA synthesis", r: "Imbalance impairs cell function." },
                    { q: "What causes pseudohyponatremia?", a: "Lab artifact from high lipids/proteins", r: "Measured sodium low but true sodium normal." },
                    { q: "Relationship between hypomagnesemia and hypokalemia?", a: "Mg required for Na-K-ATPase; Mg deficiency prevents K repletion", r: "Always check and repleted both simultaneously." }
                ]
            },
            "Transfusion": {
                100: [
                    { q: "What does PT measure?", a: "Prothrombin time - extrinsic coagulation pathway", r: "Monitored in warfarin patients." },
                    { q: "What is FFP?", a: "Fresh frozen plasma - contains all clotting factors", r: "Used for factor replacement." },
                    { q: "What is PCC?", a: "Prothrombin complex concentrate - concentrated clotting factors", r: "Superior to FFP for rapid reversal." },
                    { q: "Normal fibrinogen level?", a: "200-400 mg/dL", r: "Below 100 increases bleeding risk." },
                    { q: "What is bleeding time?", a: "Test of platelet plug formation", r: "Prolonged with platelet dysfunction." }
                ],
                200: [
                    { q: "D-dimer elevation suggests?", a: "Thromboembolic events or DIC", r: "Sensitive but not specific." },
                    { q: "What is INR?", a: "International Normalized Ratio for PT", r: "Standardized across labs." },
                    { q: "Hemolytic transfusion reaction signs?", a: "Fever, chills, dyspnea, hypotension, hemoglobinuria", r: "Stop transfusion immediately." },
                    { q: "TRALI reaction?", a: "Transfusion-related acute lung injury", r: "Develops within 6 hours of transfusion." },
                    { q: "Transfusion-associated circulatory overload?", a: "Volume overload from rapid transfusion", r: "Especially in elderly or cardiac disease." }
                ],
                300: [
                    { q: "Indications for RBC transfusion?", a: "Acute hemorrhage, symptomatic anemia, anticipated further loss", r: "Restrictive strategy preferred." },
                    { q: "How much does one unit PRBC raise Hgb?", a: "Approximately 1 g/dL", r: "Varies by patient size." },
                    { q: "Platelet transfusion indications?", a: "Plt <10K (prophylactic) or <20K with fever/infection", r: "Also for ongoing bleeding with low platelets." },
                    { q: "FFP dosing for coagulation reversal?", a: "15 mL/kg", r: "Usually 3-4 units for average adult." },
                    { q: "PCC dosing advantages?", a: "Smaller volume, faster reversal, less fluid overload risk", r: "Superior to FFP when available." }
                ],
                400: [
                    { q: "Warfarin reversal in bleeding?", a: "FFP/PCC STAT + Vitamin K IV + address bleeding source", r: "Vitamin K alone too slow (12-24 hours)." },
                    { q: "Heparin reversal?", a: "Protamine sulfate reverses unfractionated heparin", r: "1 mg reverses ~100 units heparin." },
                    { q: "DOAC reversal?", a: "Apixaban/rivaroxaban: andexanet alfa", r: "Specific factor Xa inhibitor antidote." },
                    { q: "Iron overload from transfusions?", a: "Each unit PRBC contains ~250 mg iron", r: "Chelation therapy if repeated transfusions needed." },
                    { q: "Alloimmunization risk?", a: "Repeated transfusions cause antibody formation to donor antigens", r: "Can cause delayed hemolytic reactions." }
                ],
                500: [
                    { q: "ABO incompatible transfusion consequences?", a: "Immediate hemolytic reaction - shock, DIC, death", r: "Preventable with proper blood bank procedures." },
                    { q: "Delayed hemolytic transfusion reaction timing?", a: "Days to weeks after transfusion", r: "From secondary immune response to donor antigens." },
                    { q: "Bacterial contamination of blood products risk?", a: "Septic transfusion reaction - fever, hypotension, shock", r: "Rare but life-threatening." },
                    { q: "Massive transfusion protocol definition?", a: ">=10 units PRBC in 24 hours", r: "Use blood bank-activated protocol." },
                    { q: "Coagulopathy in massive transfusion cause?", a: "Dilution of clotting factors, hypothermia, acidosis", r: "Use FFP and platelets from start." }
                ]
            },
            "Perioperative": {
                100: [
                    { q: "What is malignant hyperthermia?", a: "Pharmacogenetic reaction to anesthesia causing hyperthermia, rigidity, rhabdomyolysis", r: "Life-threatening; treat with dantrolene." },
                    { q: "Signs of MH?", a: "Elevated CO2, muscle rigidity, fever, dark urine", r: "Stop anesthesia immediately." },
                    { q: "Treatment of MH?", a: "Stop anesthetic, hyperventilate, dantrolene 2.5 mg/kg IV, active cooling", r: "Emergency treatment required." },
                    { q: "What is anaphylaxis?", a: "IgE-mediated hypersensitivity reaction", r: "Treat with epinephrine IM immediately." },
                    { q: "Signs of anaphylaxis?", a: "Urticaria, angioedema, bronchospasm, hypotension, cardiac arrest", r: "Can occur within minutes of exposure." }
                ],
                200: [
                    { q: "Treatment of anaphylaxis?", a: "Epinephrine 0.3-0.5 mg IM, IV access, antihistamines, steroids, monitor", r: "Epinephrine is life-saving." },
                    { q: "What is aspiration?", a: "Food or gastric contents inhaled into lungs during anesthesia", r: "Can cause chemical pneumonitis or obstruction." },
                    { q: "Prevention of aspiration?", a: "NPO status, rapid sequence induction, cricoid pressure", r: "Critical pre-op preparation." },
                    { q: "Perioperative hypothermia consequences?", a: "Impaired coagulation, increased infection, arrhythmias", r: "Active rewarming required post-op." },
                    { q: "Perioperative hyperglycemia risk?", a: "Increased infection and poor wound healing", r: "Tight glucose control improves outcomes." }
                ],
                300: [
                    { q: "What is PONV?", a: "Postoperative nausea and vomiting", r: "Risk factors: female, opioids, motion sickness history." },
                    { q: "PONV prevention strategies?", a: "Limit opioids, use multimodal analgesia, ondansetron, fluid optimization", r: "Preventive approach better than treatment." },
                    { q: "Postoperative sore throat cause?", a: "Endotracheal intubation trauma", r: "Usually self-limited." },
                    { q: "Awareness under anesthesia risk?", a: "Patient conscious but paralyzed during surgery", r: "Prevented by adequate anesthetic depth monitoring." },
                    { q: "Postoperative shivering cause?", a: "Perioperative hypothermia and recovery from anesthesia", r: "Increases oxygen consumption and discomfort." }
                ],
                400: [
                    { q: "Amniotic fluid embolism?", a: "Fetal tissue enters maternal circulation during labor/delivery", r: "Rare but catastrophic - causes shock and DIC." },
                    { q: "Signs of amniotic fluid embolism?", a: "Sudden hypotension, cyanosis, respiratory distress, DIC", r: "Mortality rate 50-80%." },
                    { q: "Management of amniotic fluid embolism?", a: "Aggressive resuscitation, FFP, platelets, continuous hemodynamic support", r: "Supportive care is primary treatment." },
                    { q: "Neuroleptic malignant syndrome?", a: "Reaction to antipsychotics - hyperthermia, rigidity, altered mental status", r: "Treat with dantrolene and supportive care." },
                    { q: "Serotonin syndrome signs?", a: "Hyperthermia, rigidity, hyperreflexia, altered mental status from SSRIs/MAOIs", r: "Stop serotonergic agents." }
                ],
                500: [
                    { q: "Perioperative stroke risk factors?", a: "Afib, atherosclerosis, hypotension, hypercoagulability", r: "High morbidity outcome." },
                    { q: "Perioperative MI risk?", a: "Increased demand and supply mismatch", r: "Monitor troponin post-op." },
                    { q: "Compartment syndrome post-op?", a: "Increased pressure in fascial compartment impairs perfusion", r: "Surgical emergency requiring fasciotomy." },
                    { q: "Fat embolism syndrome?", a: "Fat globules enter circulation from long bone fractures", r: "Causes hypoxia, confusion, petechial rash." },
                    { q: "Recovery from neuromuscular blocking agents?", a: "Measured by train-of-four stimulation", r: "Reversed with sugammadex or neostigmine." }
                ]
            }
        };

        let player1Score = 0;
        let player2Score = 0;
        let answeredClues = new Set();
        let currentCategory = null;
        let currentPoints = null;

        function initializeGame() {
            loadScores();
            loadAnsweredClues();
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'categories-grid';

            Object.keys(QUESTIONS).forEach(categoryName => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'category-name';
                nameDiv.textContent = categoryName;
                categoryDiv.appendChild(nameDiv);
                const pointsGridDiv = document.createElement('div');
                pointsGridDiv.className = 'points-grid';
                [100, 200, 300, 400, 500].forEach(points => {
                    const clueKey = categoryName + '-' + points;
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'point-cell';
                    cellDiv.textContent = points + ' pts';
                    if (answeredClues.has(clueKey)) {
                        cellDiv.classList.add('answered');
                    } else {
                        cellDiv.onclick = () => openQuestion(categoryName, points);
                    }
                    pointsGridDiv.appendChild(cellDiv);
                });
                categoryDiv.appendChild(pointsGridDiv);
                grid.appendChild(categoryDiv);
            });
            board.appendChild(grid);
        }

        function openQuestion(categoryName, points) {
            currentCategory = categoryName;
            currentPoints = points;
            const clues = QUESTIONS[categoryName][points];
            if (!clues || clues.length === 0) return;
            const clue = clues[Math.floor(Math.random() * clues.length)];
            document.getElementById('modalTitle').textContent = categoryName + ' - ' + points + ' pts';
            document.getElementById('questionText').textContent = clue.q;
            document.getElementById('answerText').textContent = clue.a;
            document.getElementById('rationaleText').textContent = clue.r;
            document.getElementById('questionModal').style.display = 'block';
        }

        function awardPoints(player) {
            if (player === 1) player1Score += currentPoints;
            else player2Score += currentPoints;
            markClueAnswered();
            saveScores();
            updateScoreDisplay();
            closeModal();
        }

        function skipQuestion() {
            markClueAnswered();
            closeModal();
        }

        function markClueAnswered() {
            answeredClues.add(currentCategory + '-' + currentPoints);
            saveAnsweredClues();
            renderBoard();
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            currentCategory = null;
            currentPoints = null;
        }

        function updateScoreDisplay() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function saveScores() {
            localStorage.setItem('exam2-player1', player1Score.toString());
            localStorage.setItem('exam2-player2', player2Score.toString());
        }

        function loadScores() {
            player1Score = parseInt(localStorage.getItem('exam2-player1') || '0');
            player2Score = parseInt(localStorage.getItem('exam2-player2') || '0');
            updateScoreDisplay();
        }

        function saveAnsweredClues() {
            localStorage.setItem('exam2-answered', JSON.stringify(Array.from(answeredClues)));
        }

        function loadAnsweredClues() {
            const saved = localStorage.getItem('exam2-answered');
            if (saved) answeredClues = new Set(JSON.parse(saved));
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('exam2-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('questionModal')) closeModal();
        };

        window.addEventListener('load', function() {
            if (localStorage.getItem('exam2-theme') === 'light') document.body.classList.add('light-theme');
            initializeGame();
        });
    </script>
</body>
</html>
