<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR 334 Study Guide</title>
    <link rel="stylesheet" href="assets/styles.css?v=20260823">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .study-hub {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hub-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #0066cc;
            padding-bottom: 20px;
        }

        .hub-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
            color: #0066cc;
        }

        .hub-header p {
            margin: 0;
            font-size: 1.1em;
            color: #666;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .section-card {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .section-card:hover {
            background: #f0f0f0;
            border-color: #0066cc;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15);
            transform: translateY(-2px);
        }

        .section-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.3em;
            color: #0066cc;
        }

        .section-card p {
            margin: 0;
            color: #666;
            font-size: 0.95em;
            flex-grow: 1;
        }

        .section-card .badge {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
            width: fit-content;
        }

        .exam-section {
            background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
            border: 2px solid #0052a3;
            color: white;
        }

        .exam-section:hover {
            background: linear-gradient(135deg, #0052a3 0%, #003d7a 100%);
            border-color: #002850;
        }

        .exam-section h2 {
            color: white;
        }

        .exam-section p {
            color: #e0e0e0;
        }

        .exam-section .badge {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }


        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #e0e0e0;
            }

            .section-card {
                background: #2a2a2a;
                border-color: #444;
            }

            .section-card:hover {
                background: #333;
                border-color: #0099ff;
            }

            .section-card h2 {
                color: #0099ff;
            }

            .section-card p {
                color: #aaa;
            }
        }
    </style>
</head>
<body>
    <div class="study-hub">
        <div class="hub-header">
            <h1>NUR 334 Study Guide</h1>
            <p>Medical-Surgical Nursing I — Comprehensive Study Materials</p>
        </div>

        <div class="section-grid" id="sectionGrid">
            <!-- Sections will be listed here -->
        </div>

    </div>

    <!-- Load site scripts -->
    <script src="assets/site.js?v=20260823"></script>

    <script>
        // Study sections data
        const sections = [
            {
                id: 'must-know',
                title: 'Must Know Topics',
                description: 'Essential concepts and critical information you must master',
                url: 'must-know.html',
                category: 'fundamentals'
            },
            {
                id: 'fundamentals',
                title: 'Fundamentals Review',
                description: 'Review all 11 fundamentals sections with practice questions',
                url: 'fundamentals-review-exam.html',
                category: 'exam'
            },
            {
                id: 'exam1',
                title: 'Exam 1',
                description: 'Comprehensive 70-question exam covering fundamentals and Week 1 material',
                url: 'exam1-builder.html',
                category: 'exam',
                special: true
            },
            {
                id: 'week1-respiratory',
                title: 'Week 1: Respiratory Conditions',
                description: 'Upper & lower respiratory problems, labs, and diagnostics',
                url: 'week1-lower-respiratory-problems.html',
                category: 'week1'
            },
            {
                id: 'week1-head-neck',
                title: 'Week 1: Head & Neck Cancer',
                description: 'Laryngeal cancer, treatment, and post-operative care',
                url: 'week1-head-neck-cancer.html',
                category: 'week1'
            },
            {
                id: 'week1-labs',
                title: 'Week 1: Respiratory Labs & Diagnostics',
                description: 'Diagnostic tests and lab interpretation for respiratory conditions',
                url: 'week1-respiratory-labs-diagnostics.html',
                category: 'week1'
            },
            {
                id: 'week1-lecture-review',
                title: 'Week 1: Live Lecture Review',
                description: 'Summary and key points from Week 1 live lecture',
                url: 'week1-respiratory-live-lecture-review.html',
                category: 'week1'
            },
            {
                id: 'exam2',
                title: 'Exam 2',
                description: 'Comprehensive 40-question exam covering Week 2 hematology material',
                url: 'exam2-builder.html',
                category: 'exam',
                special: true
            },
            {
                id: 'week2',
                title: 'Week 2: Hematology & Blood',
                description: 'Anemias, hematology labs, blood component therapy, CVCs',
                url: 'week2-anemias-polycythemia.html',
                category: 'week2'
            },
            {
                id: 'exam3',
                title: 'Exam 3',
                description: 'Comprehensive 50-question exam covering Week 3 electrolytes and perioperative nursing',
                url: 'week3-builder.html',
                category: 'exam',
                special: true
            },
            {
                id: 'week3-study-guide',
                title: 'Week 3: Study Guide',
                description: 'Electrolyte imbalances, fluid management, and perioperative nursing overview',
                url: 'week3-study-guide.html',
                category: 'week3'
            },
            {
                id: 'week3-flashcards',
                title: 'Week 3: Flashcards',
                description: 'Key terms, lab values, clinical signs, and quick reference cards',
                url: 'week3-flashcards.html',
                category: 'week3'
            }
        ];

        // Render section cards
        function renderSections() {
            const grid = document.getElementById('sectionGrid');
            grid.innerHTML = sections.map(section => {
                const classList = section.special ? 'section-card exam-section' : 'section-card';

                return `
                    <a href="${section.url}" class="${classList}" data-section-id="${section.id}">
                        <h2>${section.title}</h2>
                        <p>${section.description}</p>
                        <span class="badge">${section.category.toUpperCase()}</span>
                    </a>
                `;
            }).join('');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderSections);
    </script>
</body>
</html>
