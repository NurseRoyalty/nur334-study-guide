<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR 334 Study Guide</title>
    <script>(function(){try{var p=new URLSearchParams(location.search).get('theme');var t=p||localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(p){try{localStorage.setItem('theme',p)}catch(e){}}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="assets/styles.css?v=20260823">
    <style>
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }

        .section-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .section-card:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .section-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.15em;
            color: var(--brand);
        }

        .section-card p {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.95em;
            flex-grow: 1;
            line-height: 1.5;
        }

        .section-card .badge {
            display: inline-block;
            background: var(--brand-tint);
            color: var(--brand-strong);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-top: 12px;
            width: fit-content;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .exam-section {
            background: linear-gradient(120deg, var(--brand-strong), var(--brand-deep));
            border: 1px solid var(--brand-deep);
            color: #fff;
        }

        .exam-section:hover {
            box-shadow: var(--shadow-md), 0 0 20px rgba(91, 75, 138, 0.2);
        }

        .exam-section h2 {
            color: #fff;
        }

        .exam-section p {
            color: var(--on-brand-dim);
        }

        .exam-section .badge {
            background: var(--accent);
            color: #fff;
        }

        .view-container {
            display: none;
        }

        .view-container.active {
            display: block;
        }

        .builder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .section-selector {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: var(--shadow-sm);
        }

        .section-selector h3 {
            margin: 0 0 12px 0;
            color: var(--brand);
            font-size: 1em;
        }

        .section-selector .count {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .section-selector input[type="number"] {
            width: 60px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface-2);
            color: var(--text);
        }

        .section-selector .available {
            font-size: 0.85em;
            color: var(--text-soft);
        }

        .builder-actions {
            display: flex;
            gap: 10px;
            margin: 30px 0;
        }

        .builder-actions button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--brand);
            color: white;
        }

        .btn-primary:hover {
            background: var(--brand-strong);
        }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-3);
        }

        .question-count {
            margin: 20px 0;
            padding: 15px;
            background: var(--brand-tint);
            border-radius: var(--radius-sm);
            color: var(--brand-strong);
            font-weight: 600;
        }

        .back-button {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .back-button:hover {
            background: var(--brand-strong);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1820;
                --surface: #2a2530;
                --surface-2: #353040;
                --surface-3: #403a4f;
                --border: #4a4460;
                --border-strong: #5a5470;
                --text: #e8e4f0;
                --text-soft: #b8b0c8;
                --text-faint: #8a8299;
                --stripe: #23202a;

                --brand: #9d8cc4;
                --brand-strong: #8a7ab5;
                --brand-deep: #6b5a96;
                --brand-tint: #3a3250;
                --brand-tint-2: #44395a;

                --accent: #e07fa3;
                --accent-strong: #d4629b;
                --accent-tint: #3d2838;

                --on-brand-soft: #c3b9d4;
                --on-brand-faint: #9d92b5;
                --on-brand-dim: #b8adc8;
            }
        }
    </style>
</head>
<body data-page="index">
    <a class="skip-link" href="#content">Skip to content</a>

    <main id="content">
        <div class="page-inner">
            <header class="page-head">
                <h1>NUR 334 Study Guide</h1>
                <p style="color: var(--text-soft); margin-top: 8px;">Medical-Surgical Nursing I — Complete Study Materials & Exams</p>
            </header>

            <!-- Hub View -->
            <div class="view-container active" id="hubView">
                <div class="section-grid" id="sectionGrid">
                    <!-- Sections will be rendered here -->
                </div>
            </div>

            <!-- Exam Builder View -->
            <div class="view-container" id="builderView">
                <button class="back-button" onclick="showHub()">← Back to Study Guide</button>
                <h2 style="color: var(--brand);">Build Your Custom Exam</h2>
                <p style="color: var(--text-soft);">Select how many questions you want from each section (0-10)</p>

                <div class="builder-grid" id="builderGrid">
                    <!-- Section selectors will be rendered here -->
                </div>

                <div class="question-count" id="questionCount">Total Questions: 0</div>

                <div class="builder-actions">
                    <button class="btn-primary" onclick="generateExam()">Generate Exam</button>
                    <button class="btn-secondary" onclick="showHub()">Cancel</button>
                </div>
            </div>

            <!-- Exam View -->
            <div class="view-container" id="examView">
                <button class="back-button" onclick="showHub()">← Back to Study Guide</button>
                <div id="exam-root"></div>
            </div>

            <nav class="page-flip" data-page-flip></nav>
            <footer class="site-foot">Built from the course lecture material — for personal study use.</footer>
        </div>
    </main>

    <!-- Load exam data -->
    <script src="data/exam1-questions.js?v=20260823"></script>
    <script src="assets/site.js?v=20260823"></script>
    <script src="assets/exam.js?v=20260823"></script>

    <script>
        let allQuestions = [];
        let questionsBySection = {};

        const sections = [
            { id: 'exam-builder', title: 'Build Your Own Exam', description: 'Select questions from each section to create a custom exam', category: 'EXAM', special: true },
            { id: 'fundamentals', title: 'Fundamentals Review', description: 'Review all 11 fundamentals sections with practice questions', url: 'fundamentals-review-exam.html', category: 'REVIEW' },
            { id: 'must-know', title: 'Must Know Topics', description: 'Essential concepts and critical information you must master', url: 'must-know.html', category: 'REVIEW' },
            { id: 'week1-lecture', title: 'Week 1: Live Lecture Review', description: 'Summary and key points from Week 1 live lecture', url: 'week1-respiratory-live-lecture-review.html', category: 'WEEK 1' },
            { id: 'week1-lower-respiratory', title: 'Week 1: Lower Respiratory Problems', description: 'Pneumonia, COPD, asthma, TB, and other lung conditions', url: 'week1-lower-respiratory-problems.html', category: 'WEEK 1' },
            { id: 'week1-upper-respiratory', title: 'Week 1: Upper Respiratory Problems', description: 'Sinusitis, pharyngitis, laryngitis, sleep apnea, epistaxis', url: 'week1-upper-respiratory-problems.html', category: 'WEEK 1' },
            { id: 'week1-labs', title: 'Week 1: Respiratory Labs & Diagnostics', description: 'Diagnostic tests and lab interpretation', url: 'week1-respiratory-labs-diagnostics.html', category: 'WEEK 1' },
            { id: 'week1-head-neck', title: 'Week 1: Head & Neck Cancer', description: 'Laryngeal cancer, treatment, and post-operative care', url: 'week1-head-neck-cancer.html', category: 'WEEK 1' },
            { id: 'week2', title: 'Week 2: Hematology & Blood', description: 'Anemias, hematology labs, blood component therapy, CVCs', url: 'week2-anemias-polycythemia.html', category: 'WEEK 2' }
        ];

        function initializeData() {
            if (typeof window.EXAM_DATA !== 'undefined') {
                allQuestions = window.EXAM_DATA.questions;
                // Group by section
                allQuestions.forEach(q => {
                    const section = q.section;
                    if (!questionsBySection[section]) {
                        questionsBySection[section] = [];
                    }
                    questionsBySection[section].push(q);
                });
            }
        }

        function renderSections() {
            const grid = document.getElementById('sectionGrid');
            grid.innerHTML = sections.map(section => {
                const classList = section.special ? 'section-card exam-section' : 'section-card';
                const link = section.special ? `javascript:showBuilder()` : section.url;

                return `
                    <a href="${link}" class="${classList}" data-section-id="${section.id}">
                        <h2>${section.title}</h2>
                        <p>${section.description}</p>
                        <span class="badge">${section.category}</span>
                    </a>
                `;
            }).join('');
        }

        function showHub() {
            document.getElementById('hubView').classList.add('active');
            document.getElementById('builderView').classList.remove('active');
            document.getElementById('examView').classList.remove('active');
            document.getElementById('exam-root').innerHTML = '';
        }

        function showBuilder() {
            document.getElementById('hubView').classList.remove('active');
            document.getElementById('builderView').classList.add('active');
            document.getElementById('examView').classList.remove('active');
            renderBuilder();
        }

        function renderBuilder() {
            const grid = document.getElementById('builderGrid');
            const sectionOrder = ['diuretics-antihypertensives', 'insulins', 'nsaids-steroids', 'assessment', 'skills', 'specimen-communication', 'respiratory-labs-diagnostics', 'upper-respiratory', 'head-neck-cancer', 'lower-respiratory'];

            grid.innerHTML = sectionOrder.map(section => {
                const count = questionsBySection[section] ? questionsBySection[section].length : 0;
                const display = section.replace(/-/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                return `
                    <div class="section-selector">
                        <h3>${display}</h3>
                        <div class="count">
                            <input type="number" id="input-${section}" min="0" max="${count}" value="${Math.min(10, count)}" onchange="updateCount()">
                            <span>questions</span>
                        </div>
                        <div class="available">(${count} available)</div>
                    </div>
                `;
            }).join('');

            updateCount();
        }

        function updateCount() {
            const inputs = document.querySelectorAll('.section-selector input');
            let total = 0;
            inputs.forEach(input => {
                total += parseInt(input.value) || 0;
            });
            document.getElementById('questionCount').textContent = `Total Questions: ${total}`;
        }

        function generateExam() {
            const sectionOrder = ['diuretics-antihypertensives', 'insulins', 'nsaids-steroids', 'assessment', 'skills', 'specimen-communication', 'respiratory-labs-diagnostics', 'upper-respiratory', 'head-neck-cancer', 'lower-respiratory'];

            let selectedQuestions = [];

            sectionOrder.forEach(section => {
                const input = document.getElementById(`input-${section}`);
                if (input) {
                    const count = parseInt(input.value) || 0;
                    if (questionsBySection[section]) {
                        selectedQuestions = selectedQuestions.concat(questionsBySection[section].slice(0, count));
                    }
                }
            });

            if (selectedQuestions.length === 0) {
                alert('Please select at least one question');
                return;
            }

            // Shuffle questions
            selectedQuestions = selectedQuestions.sort(() => Math.random() - 0.5);

            // Set exam data
            window.examData = {
                id: 'custom-exam',
                title: `Custom Exam (${selectedQuestions.length} Questions)`,
                questions: selectedQuestions
            };

            // Show exam view
            document.getElementById('hubView').classList.remove('active');
            document.getElementById('builderView').classList.remove('active');
            document.getElementById('examView').classList.add('active');

            // Render exam
            setTimeout(() => {
                if (typeof initExam === 'function') {
                    initExam();
                }
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeData();
            renderSections();
        });
    </script>
</body>
</html>
