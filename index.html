<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR 334 Study Guide</title>
    <script>(function(){try{var p=new URLSearchParams(location.search).get('theme');var t=p||localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(p){try{localStorage.setItem('theme',p)}catch(e){}}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="assets/styles.css?v=20260823">
    <style>
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }

        .section-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
        }

        .section-card:hover {
            border-color: var(--brand);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .section-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.15em;
            color: var(--brand);
        }

        .section-card p {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.95em;
            flex-grow: 1;
            line-height: 1.5;
        }

        .section-card .badge {
            display: inline-block;
            background: var(--brand-tint);
            color: var(--brand-strong);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-top: 12px;
            width: fit-content;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .exam-section {
            background: linear-gradient(120deg, var(--brand-strong), var(--brand-deep));
            border: 1px solid var(--brand-deep);
            color: #fff;
        }

        .exam-section:hover {
            box-shadow: var(--shadow-md), 0 0 20px rgba(91, 75, 138, 0.2);
        }

        .exam-section h2 {
            color: #fff;
        }

        .exam-section p {
            color: var(--on-brand-dim);
        }

        .exam-section .badge {
            background: var(--accent);
            color: #fff;
        }

        .exam-embed {
            display: none;
        }

        .exam-embed.active {
            display: block;
            margin-top: 20px;
        }

        .back-button {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .back-button:hover {
            background: var(--brand-strong);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1820;
                --surface: #2a2530;
                --surface-2: #353040;
                --surface-3: #403a4f;
                --border: #4a4460;
                --border-strong: #5a5470;
                --text: #e8e4f0;
                --text-soft: #b8b0c8;
                --text-faint: #8a8299;
                --stripe: #23202a;

                --brand: #9d8cc4;
                --brand-strong: #8a7ab5;
                --brand-deep: #6b5a96;
                --brand-tint: #3a3250;
                --brand-tint-2: #44395a;

                --accent: #e07fa3;
                --accent-strong: #d4629b;
                --accent-tint: #3d2838;

                --on-brand-soft: #c3b9d4;
                --on-brand-faint: #9d92b5;
                --on-brand-dim: #b8adc8;

                --chrome-a: #2a2450;
                --chrome-b: #1b1734;
                --flash-a: #5a4d93;
                --flash-b: #3f356e;

                --line-accent: #5a4a70;
                --line-bad: #6a4a45;

                --torture: #d75149;
                --torture-light: #e8836e;
                --torture-dark: #c0463f;
                --torture-soft: #4a2b28;

                --ok: #4fb38f;
                --ok-strong: #3a9575;
                --ok-tint: #1e4a38;
                --bad: #e8605a;
                --bad-strong: #d4423d;
                --bad-tint: #5a2b28;
            }
        }
    </style>
</head>
<body data-page="index">
    <a class="skip-link" href="#content">Skip to content</a>

    <main id="content">
        <div class="page-inner">
            <header class="page-head">
                <h1>NUR 334 Study Guide</h1>
                <p style="color: var(--text-soft); margin-top: 8px;">Medical-Surgical Nursing I — Complete Study Materials & Exams</p>
            </header>

            <div class="section-grid" id="sectionGrid">
                <!-- Sections will be rendered here -->
            </div>

            <div class="exam-embed" id="examContainer">
                <div id="exam-root"></div>
            </div>

            <nav class="page-flip" data-page-flip></nav>
            <footer class="site-foot">Built from the course lecture material — for personal study use.</footer>
        </div>
    </main>

    <!-- Load exam data from external files -->
    <script src="data/exam1-questions.js?v=20260823"></script>
    <script src="assets/site.js?v=20260823"></script>
    <script src="assets/exam.js?v=20260823"></script>

    <script>
        const sections = [
            {
                id: 'exam1',
                title: 'Exam 1 — Consolidated Assessment',
                description: '70 comprehensive questions: 30 fundamentals (diuretics, insulins, NSAIDs, assessment, skills, communication) + 40 Week 1 content (10 each: respiratory labs, upper respiratory, head/neck cancer, lower respiratory)',
                category: 'EXAM',
                special: true
            },
            {
                id: 'fundamentals',
                title: 'Fundamentals Review',
                description: 'Review all 11 fundamentals sections with practice questions',
                url: 'fundamentals-review-exam.html',
                category: 'REVIEW'
            },
            {
                id: 'must-know',
                title: 'Must Know Topics',
                description: 'Essential concepts and critical information you must master',
                url: 'must-know.html',
                category: 'REVIEW'
            },
            {
                id: 'week1-lecture',
                title: 'Week 1: Live Lecture Review',
                description: 'Summary and key points from Week 1 live lecture',
                url: 'week1-respiratory-live-lecture-review.html',
                category: 'WEEK 1'
            },
            {
                id: 'week1-lower-respiratory',
                title: 'Week 1: Lower Respiratory Problems',
                description: 'Pneumonia, COPD, asthma, TB, and other lung conditions',
                url: 'week1-lower-respiratory-problems.html',
                category: 'WEEK 1'
            },
            {
                id: 'week1-upper-respiratory',
                title: 'Week 1: Upper Respiratory Problems',
                description: 'Sinusitis, pharyngitis, laryngitis, sleep apnea, epistaxis',
                url: 'week1-upper-respiratory-problems.html',
                category: 'WEEK 1'
            },
            {
                id: 'week1-labs',
                title: 'Week 1: Respiratory Labs & Diagnostics',
                description: 'Diagnostic tests and lab interpretation',
                url: 'week1-respiratory-labs-diagnostics.html',
                category: 'WEEK 1'
            },
            {
                id: 'week1-head-neck',
                title: 'Week 1: Head & Neck Cancer',
                description: 'Laryngeal cancer, treatment, and post-operative care',
                url: 'week1-head-neck-cancer.html',
                category: 'WEEK 1'
            },
            {
                id: 'week2',
                title: 'Week 2: Hematology & Blood',
                description: 'Anemias, hematology labs, blood component therapy, CVCs',
                url: 'week2-anemias-polycythemia.html',
                category: 'WEEK 2'
            }
        ];

        function renderSections() {
            const grid = document.getElementById('sectionGrid');
            grid.innerHTML = sections.map(section => {
                const classList = section.special ? 'section-card exam-section' : 'section-card';
                const link = section.special ? `javascript:loadExam('${section.id}')` : section.url;

                return `
                    <a href="${link}" class="${classList}" data-section-id="${section.id}">
                        <h2>${section.title}</h2>
                        <p>${section.description}</p>
                        <span class="badge">${section.category}</span>
                    </a>
                `;
            }).join('');
        }

        async function loadExam(examId) {
            const container = document.getElementById('examContainer');
            const grid = document.getElementById('sectionGrid');

            // Hide grid, show exam
            grid.style.display = 'none';
            container.classList.add('active');

            // Add back button if not already there
            if (!container.querySelector('.back-button')) {
                const backBtn = document.createElement('button');
                backBtn.className = 'back-button';
                backBtn.textContent = '← Back to Study Guide';
                backBtn.onclick = () => {
                    container.classList.remove('active');
                    grid.style.display = 'grid';
                    document.getElementById('exam-root').innerHTML = '';
                };
                container.insertBefore(backBtn, container.firstChild);
            }

            // Set exam data
            if (examId === 'exam1' && typeof window.EXAM_DATA !== 'undefined') {
                window.examData = window.EXAM_DATA;
            }

            // Render exam
            setTimeout(() => {
                if (typeof initExam === 'function') {
                    initExam();
                }
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', renderSections);
    </script>
</body>
</html>
