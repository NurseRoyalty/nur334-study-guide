<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam 2 Jeopardy - 2 Player Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .scores {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }

        .player-score {
            background: #333;
            padding: 15px 30px;
            border-radius: 8px;
            min-width: 200px;
            text-align: center;
        }

        .player-score.active {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-points {
            font-size: 28px;
            font-weight: bold;
        }

        .board {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-header {
            background: #1a5490;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clue-cell {
            background: #2d5a9b;
            border: 2px solid #4d7fbf;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .clue-cell:hover:not(.answered) {
            background: #3d7aab;
            box-shadow: 0 0 10px #4d7fbf;
            transform: scale(1.05);
        }

        .clue-cell.answered {
            background: #333;
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            border: 3px solid #4d7fbf;
        }

        .question-text {
            font-size: 20px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .answer-section {
            background: #1a3a52;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        .answer-label {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 8px;
        }

        .answer-text {
            font-size: 16px;
            line-height: 1.5;
        }

        .rationale-section {
            background: #1a2a3a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }

        .rationale-label {
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 8px;
        }

        .rationale-text {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-player1 {
            background: #4CAF50;
            color: white;
        }

        .btn-player1:hover {
            background: #45a049;
        }

        .btn-player2 {
            background: #ff9800;
            color: white;
        }

        .btn-player2:hover {
            background: #fb8c00;
        }

        .btn-close {
            background: #666;
            color: white;
            min-width: 100px;
        }

        .btn-close:hover {
            background: #555;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-reset {
            background: #d32f2f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-reset:hover {
            background: #b71c1c;
        }
    </style>
    <script src="data/exam2-jeopardy.js"></script>
</head>
<body>
    <div class="header">
        <h1>EXAM 2 JEOPARDY</h1>
        <h3>NCLEX NGN Clinical Judgment - 2 Player Game</h3>
    </div>

    <div class="scores">
        <div class="player-score active" id="player1Score">
            <div class="player-name">Player 1</div>
            <div class="player-points" id="p1Points">0</div>
        </div>
        <div class="player-score" id="player2Score">
            <div class="player-name">Player 2</div>
            <div class="player-points" id="p2Points">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-reset" onclick="resetGame()">Reset Game</button>
    </div>

    <div class="board" id="board"></div>

    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div class="question-text" id="questionText"></div>
            <div class="answer-section">
                <div class="answer-label">Answer/Action:</div>
                <div class="answer-text" id="answerText"></div>
            </div>
            <div class="rationale-section">
                <div class="rationale-label">Rationale:</div>
                <div class="rationale-text" id="rationaleText"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-player1" onclick="awardPoints(1)">Player 1 Correct (+)</button>
                <button class="btn btn-player2" onclick="awardPoints(2)">Player 2 Correct (+)</button>
                <button class="btn btn-close" onclick="closeQuestion()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let player1Score = 0;
        let player2Score = 0;
        let currentQuestion = null;
        let currentPoints = 0;
        let answeredQuestions = new Set();
        let currentPlayer = 1;

        function initializeBoard() {
            if (!window.JEOPARDY_EXAM2) {
                alert('Error: Question data not loaded');
                return;
            }

            const board = document.getElementById('board');
            board.innerHTML = '';

            // Add category headers
            window.JEOPARDY_EXAM2.categories.forEach(cat => {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = cat.name;
                board.appendChild(header);
            });

            // Add clue cells
            const tiers = ['100', '200', '300', '400', '500'];
            tiers.forEach(tier => {
                window.JEOPARDY_EXAM2.categories.forEach(cat => {
                    const cell = document.createElement('div');
                    cell.className = 'clue-cell';
                    cell.textContent = tier + ' points';

                    const questionId = cat.id + '-' + tier;

                    if (answeredQuestions.has(questionId)) {
                        cell.classList.add('answered');
                    }

                    cell.onclick = () => selectQuestion(cat, tier, parseInt(tier), cell, questionId);

                    board.appendChild(cell);
                });
            });
        }

        function selectQuestion(category, tier, points, cell, questionId) {
            if (answeredQuestions.has(questionId)) return;

            const question = category.clues[tier][0]; // Simplified: just take first
            currentQuestion = question;
            currentPoints = points;

            document.getElementById('questionText').textContent = question.q;
            document.getElementById('answerText').textContent = question.a;
            document.getElementById('rationaleText').textContent = question.rationale;

            document.getElementById('questionModal').classList.add('active');

            answeredQuestions.add(questionId);
            cell.classList.add('answered');
        }

        function awardPoints(player) {
            if (player === 1) {
                player1Score += currentPoints;
                document.getElementById('p1Points').textContent = player1Score;
                currentPlayer = 1;
            } else {
                player2Score += currentPoints;
                document.getElementById('p2Points').textContent = player2Score;
                currentPlayer = 2;
            }

            updatePlayerIndicator();
            closeQuestion();
        }

        function updatePlayerIndicator() {
            document.getElementById('player1Score').classList.toggle('active', currentPlayer === 1);
            document.getElementById('player2Score').classList.toggle('active', currentPlayer === 2);
        }

        function closeQuestion() {
            document.getElementById('questionModal').classList.remove('active');
        }

        function resetGame() {
            player1Score = 0;
            player2Score = 0;
            answeredQuestions.clear();
            currentPlayer = 1;

            document.getElementById('p1Points').textContent = '0';
            document.getElementById('p2Points').textContent = '0';
            updatePlayerIndicator();

            initializeBoard();
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeBoard);
    </script>
</body>
</html>
