<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy - NCLEX NGN Clinical Judgment</title>
    <link rel="stylesheet" href="assets/jeopardy.css">
    <style>
        /* Override with study guide colors - pink and purple */
        :root {
            --brand: #6b3b7a;
            --accent: #d946a6;
            --accent-light: #ec4899;
            --text: #ffffff;
            --bg-dark: #2d1b3d;
            --bg-light: #3d2555;
        }

        body {
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b3d 50%, #1a0f2e 100%);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .custom-header {
            background: linear-gradient(135deg, #6b3b7a 0%, #9333ea 100%);
            border-bottom: 4px solid var(--accent);
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(217, 70, 166, 0.3);
        }

        .custom-header h1 {
            font-size: 32px;
            color: #fce7f3;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .custom-header p {
            font-size: 14px;
            color: #f0d9ff;
            margin: 4px 0 0 0;
        }

        .header-content {
            flex: 1;
            min-width: 300px;
        }

        .header-button {
            padding: 10px 18px;
            border: 2px solid #fce7f3;
            background: transparent;
            color: #fce7f3;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .header-button:hover {
            background: #fce7f3;
            color: #6b3b7a;
            transform: scale(1.05);
        }

        /* Category headers - show topic names */
        .jp-categories-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            padding: 20px;
            background: rgba(107, 59, 122, 0.2);
            margin-bottom: 20px;
        }

        .jp-category-header {
            background: linear-gradient(135deg, #d946a6 0%, #ec4899 100%);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(217, 70, 166, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        /* Game board styling */
        .jp-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            padding: 20px;
            background: rgba(45, 27, 61, 0.5);
            border-radius: 12px;
            margin: 0 20px 30px 20px;
        }

        .jp-slot {
            background: linear-gradient(135deg, #9333ea 0%, #d946a6 100%);
            border: 2px solid #ec4899;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(217, 70, 166, 0.3);
            aspect-ratio: 1;
            padding: 10px;
        }

        .jp-slot:hover:not(.used) {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 8px 25px rgba(217, 70, 166, 0.5);
            background: linear-gradient(135deg, #d946a6 0%, #ec4899 100%);
        }

        .jp-slot.used {
            background: #3d2555;
            color: #6b4d7d;
            cursor: not-allowed;
            border-color: #5d4d7d;
            box-shadow: none;
        }

        /* Modal styling */
        .jp-modal-content {
            background: linear-gradient(135deg, #2d1b3d 0%, #3d2555 100%);
            border: 3px solid var(--accent);
            box-shadow: 0 10px 40px rgba(217, 70, 166, 0.4);
        }

        .jp-modal-label {
            color: #ec4899;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }

        .jp-modal-buttons button {
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent-light);
            cursor: pointer;
            font-weight: bold;
        }

        .jp-modal-buttons button:hover {
            background: var(--accent);
            color: #2d1b3d;
        }

        /* Stats bar */
        .stats-display {
            background: linear-gradient(135deg, rgba(107, 59, 122, 0.3), rgba(217, 70, 166, 0.2));
            border-top: 2px solid var(--accent);
            border-bottom: 2px solid var(--accent);
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: #d946a6;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 24px;
            color: #fce7f3;
            font-weight: bold;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .jp-board {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            }

            .jp-slot {
                font-size: 14px;
            }

            .custom-header {
                flex-direction: column;
                text-align: center;
            }

            .custom-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="custom-header">
        <div class="header-content">
            <h1>🎯 NUR334 Exam 2 Jeopardy</h1>
            <p>NCLEX-NGN Clinical Judgment - 105 High-Yield Questions</p>
        </div>
        <button class="header-button" onclick="window.location.href='index.html'">← Back to Study Guide</button>
    </div>

    <div class="stats-display">
        <div class="stat-item">
            <span class="stat-label">Mode</span>
            <span class="stat-value">2 Players</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="current-score">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Progress</span>
            <span class="stat-value" id="progress">0/25</span>
        </div>
    </div>

    <div class="jp-categories-row" id="category-headers"></div>

    <div id="jp-root"></div>

    <script src="data/exam2-jeopardy.js"></script>
    <script>
      // Force all 7 categories to display (not just 5 random)
      window.NUM_CATEGORIES = 7;

      // Map JEOPARDY_EXAM2 to JEOPARDY_WEEK2 for the game engine
      if (window.JEOPARDY_EXAM2 !== undefined && window.JEOPARDY_WEEK2 === undefined) {
        window.JEOPARDY_WEEK2 = window.JEOPARDY_EXAM2;
      }

      // Display category headers
      window.addEventListener('load', () => {
        const headersContainer = document.getElementById('category-headers');
        if (window.JEOPARDY_WEEK2 && window.JEOPARDY_WEEK2.categories) {
          window.JEOPARDY_WEEK2.categories.slice(0, 7).forEach(cat => {
            const header = document.createElement('div');
            header.className = 'jp-category-header';
            header.textContent = cat.name;
            headersContainer.appendChild(header);
          });
        }
      });
    </script>
    <script src="assets/jeopardy.js"></script>
</body>
</html>
