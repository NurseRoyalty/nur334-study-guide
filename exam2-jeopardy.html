<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exam 2 Jeopardy</title>
    <script src="data/exam2-jeopardy.js"></script>
</head>
<body>
    <h1>Exam 2 Jeopardy - 105 NCLEX NGN Questions</h1>
    <div id="content"></div>
    <script>
        function renderQuestions() {
            let html = '';

            if (!window.JEOPARDY_EXAM2) {
                document.getElementById('content').innerHTML = '<p>Error: Question data not loaded</p>';
                return;
            }

            window.JEOPARDY_EXAM2.categories.forEach(cat => {
                html += '<h2>' + cat.name + '</h2>';
                html += '<table border="1" cellpadding="10" style="width:100%; margin-bottom:20px;">';

                ['100', '200', '300', '400', '500'].forEach(tier => {
                    if (cat.clues[tier]) {
                        cat.clues[tier].forEach(q => {
                            html += '<tr><td><b>' + tier + ' points</b></td><td>';
                            html += '<b>Q:</b> ' + q.q + '<br><br>';
                            html += '<b>Answer:</b> ' + q.a + '<br><br>';
                            html += '<b>Rationale:</b> ' + q.rationale;
                            html += '</td></tr>';
                        });
                    }
                });

                html += '</table>';
            });

            document.getElementById('content').innerHTML = html;
        }

        renderQuestions();
    </script>
</body>
</html>
