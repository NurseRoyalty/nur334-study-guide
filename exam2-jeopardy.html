<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy - NCLEX NGN Clinical Judgment</title>
    <link rel="stylesheet" href="assets/jeopardy.css">
    <style>
        .custom-header {
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid #d4a574;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .custom-header h1 {
            font-size: 28px;
            color: #d4a574;
            margin: 0;
        }

        .custom-header p {
            font-size: 14px;
            color: #999;
            margin: 4px 0 0 0;
        }

        .header-content {
            flex: 1;
            min-width: 300px;
        }

        .header-button {
            padding: 8px 16px;
            border: 1px solid #d4a574;
            background: transparent;
            color: #d4a574;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .header-button:hover {
            background: #d4a574;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="custom-header">
        <div class="header-content">
            <h1>🎯 NUR334 Exam 2 Jeopardy</h1>
            <p>NCLEX-NGN Clinical Judgment - 105 High-Yield Questions</p>
        </div>
        <button class="header-button" onclick="window.location.href='index.html'">← Back to Study Guide</button>
    </div>

    <div id="jp-root"></div>

    <script src="data/exam2-jeopardy.js"></script>
    <script>
      // Force all 7 categories to display (not just 5 random)
      window.NUM_CATEGORIES = 7;

      // Map JEOPARDY_EXAM2 to JEOPARDY_WEEK2 for the game engine
      if (window.JEOPARDY_EXAM2 !== undefined && window.JEOPARDY_WEEK2 === undefined) {
        window.JEOPARDY_WEEK2 = window.JEOPARDY_EXAM2;
      }
    </script>
    <script src="assets/jeopardy.js"></script>
</body>
</html>
