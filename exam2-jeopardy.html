<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy - NCLEX NGN Clinical Judgment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-column {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .questions-list {
            padding: 0;
        }

        .question-item {
            padding: 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .question-item:hover {
            background: #f5f5f5;
        }

        .question-item:last-child {
            border-bottom: none;
        }

        .tier-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }

        .question-preview {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-close:hover {
            background: #764ba2;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #333;
        }

        .answer-section {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .answer-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .answer-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        .rationale-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #764ba2;
        }

        .rationale-label {
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 8px;
        }

        .rationale-text {
            font-size: 15px;
            line-height: 1.8;
            color: #555;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .nav-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .nav-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: #764ba2;
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NUR334 Exam 2 - NCLEX NGN Clinical Judgment Jeopardy</h1>
        <div class="categories-grid" id="categoriesGrid"></div>
    </div>

    <div class="modal" id="questionModal">
        <div style="width: 100%; display: flex; justify-content: center;">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">Close</button>
                <div class="question-text" id="modalQuestion"></div>
                <div class="answer-section">
                    <div class="answer-label">Answer/Action:</div>
                    <div class="answer-text" id="modalAnswer"></div>
                </div>
                <div class="rationale-section">
                    <div class="rationale-label">Rationale:</div>
                    <div class="rationale-text" id="modalRationale"></div>
                </div>
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevBtn" onclick="previousQuestion()" disabled>← Previous</button>
                    <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <script src="data/exam2-jeopardy.js"></script>
    <script>
        let allQuestions = [];
        let currentQuestionIndex = 0;

        function initializeQuestions() {
            if (typeof window.JEOPARDY_EXAM2 === 'undefined') {
                console.error('Question data not loaded');
                document.getElementById('categoriesGrid').innerHTML = '<p style="color: white; text-align: center;">Error: Question data not found. Make sure exam2-jeopardy.js is loaded.</p>';
                return;
            }

            const data = window.JEOPARDY_EXAM2;
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';

            data.categories.forEach((category, catIndex) => {
                const categoryColumn = document.createElement('div');
                categoryColumn.className = 'category-column';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = category.name;
                categoryColumn.appendChild(header);

                const questionsList = document.createElement('div');
                questionsList.className = 'questions-list';

                // Collect all questions from all tiers
                const tiers = ['100', '200', '300', '400', '500'];

                tiers.forEach(tier => {
                    if (category.clues[tier]) {
                        category.clues[tier].forEach((q, qIndex) => {
                            allQuestions.push(q);

                            const qItem = document.createElement('div');
                            qItem.className = 'question-item';

                            const tierLabel = document.createElement('span');
                            tierLabel.className = 'tier-label';
                            tierLabel.textContent = '$' + tier;

                            const preview = document.createElement('div');
                            preview.className = 'question-preview';
                            preview.textContent = q.q.substring(0, 80) + '...';

                            qItem.appendChild(tierLabel);
                            qItem.appendChild(preview);
                            qItem.onclick = () => openQuestion(q);

                            questionsList.appendChild(qItem);
                        });
                    }
                });

                categoryColumn.appendChild(questionsList);
                grid.appendChild(categoryColumn);
            });
        }

        function openQuestion(question) {
            currentQuestionIndex = allQuestions.indexOf(question);
            displayQuestion(question);
            document.getElementById('questionModal').classList.add('active');
        }

        function displayQuestion(question) {
            document.getElementById('modalQuestion').textContent = question.q;
            document.getElementById('modalAnswer').textContent = question.a;
            document.getElementById('modalRationale').textContent = question.rationale;

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = currentQuestionIndex === allQuestions.length - 1;
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion(allQuestions[currentQuestionIndex]);
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < allQuestions.length - 1) {
                currentQuestionIndex++;
                displayQuestion(allQuestions[currentQuestionIndex]);
            }
        }

        function closeModal() {
            document.getElementById('questionModal').classList.remove('active');
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initializeQuestions);
    </script>
</body>
</html>
