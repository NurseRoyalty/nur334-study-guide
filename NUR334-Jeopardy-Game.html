<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0d1b2a;
            --bg-light: #1a2940;
            --text: #ffffff;
            --blue: #2a6ba6;
            --red: #e63946;
            --gold: #f4a261;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            padding: 20px;
        }

        .header {
            text-align: center;
            background: linear-gradient(135deg, var(--blue), var(--red));
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 2em; margin-bottom: 5px; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .scores { display: flex; gap: 40px; font-weight: bold; }
        .score-val { color: var(--gold); font-size: 1.3em; }

        button {
            background: var(--blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #3a7bb6; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: var(--bg-light);
            border: 2px solid var(--gold);
            padding: 10px 20px;
        }

        .tab-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .board {
            display: none;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
        }

        .board.active { display: grid; }

        .category {
            background: var(--bg-light);
            border: 2px solid #3a4a5a;
            border-radius: 8px;
        }

        .cat-header {
            background: linear-gradient(135deg, var(--blue), var(--red));
            padding: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9em;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clues { display: flex; flex-direction: column; gap: 8px; padding: 10px; }

        .clue {
            background: var(--blue);
            border: 2px solid var(--gold);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .clue:hover:not(.answered) {
            background: #3a7bb6;
            transform: scale(1.05);
        }

        .clue.answered {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--bg-dark);
            border: 3px solid var(--blue);
            border-radius: 8px;
            padding: 30px;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .q-header { color: var(--gold); font-size: 1.2em; margin-bottom: 15px; }

        .q-body {
            background: var(--bg-light);
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--blue);
            line-height: 1.6;
        }

        .answer-section {
            background: #1a5a1a;
            border: 2px solid #4a9a4a;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            color: #a0ffa0;
            display: none;
        }

        .answer-section.show { display: block; }

        .reveal-btn {
            width: 100%;
            background: var(--red);
            padding: 12px;
            margin-bottom: 15px;
        }

        .reveal-btn:hover { background: #c81e35; }

        .score-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .score-buttons button { flex: 1; }

        .close-btn {
            width: 100%;
            background: var(--red);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏥 NUR334 Exam 2 Jeopardy</h1>
    <p>NCLEX-NGN Clinical Judgment</p>
</div>

<div class="controls">
    <div class="scores">
        <div>Player 1: <span class="score-val" id="p1">0</span></div>
        <div>Player 2: <span class="score-val" id="p2">0</span></div>
    </div>
    <button onclick="resetAll()">🔄 Reset</button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchBoard(0)">Game 1</button>
    <button class="tab-btn" onclick="switchBoard(1)">Game 2</button>
    <button class="tab-btn" onclick="switchBoard(2)">Game 3</button>
</div>

<div id="board-0" class="board active"></div>
<div id="board-1" class="board"></div>
<div id="board-2" class="board"></div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="q-header" id="modal-title">Question</div>
        <div class="q-body" id="modal-question">Q: </div>
        <button class="reveal-btn" onclick="revealAns()">Reveal Answer</button>
        <div class="answer-section" id="ans-section">
            <div><strong id="answer">ANSWER</strong></div>
            <div style="margin-top: 10px; border-top: 1px solid #4a9a4a; padding-top: 10px;">
                <strong>Rationale:</strong><br>
                <div id="rationale" style="margin-top: 5px;"></div>
            </div>
        </div>
        <div class="score-buttons">
            <button onclick="addPts(1, 100)">P1 +$100</button>
            <button onclick="addPts(1, -100)">P1 -$100</button>
            <button onclick="addPts(2, 100)">P2 +$100</button>
            <button onclick="addPts(2, -100)">P2 -$100</button>
        </div>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const QUESTIONS = {
    0: {
        0: { 100: [{q: "68yo on warfarin (INR 8.3) with severe GI bleed, BP 88/52. PRIORITY reversal strategy?", a: "FFP 15mL/kg STAT + Vitamin K 10mg IV + consider PCC if available", r: "FFP provides immediate factor replacement while Vitamin K takes 12-24 hours. PCC preferred if available (smaller volume, faster reversal)."}], 200: [{q: "45yo sickle cell with ACS receives 2 PRBC in ER. Chest pain WORSENS post-transfusion. What is critical complication?", a: "Simple transfusion WORSENED ACS by increasing viscosity. STOP further simple transfusions immediately. EXCHANGE transfusion required to reduce HgbS <30%", r: "Simple transfusion WORSENS ACS by increasing viscosity and microvascular occlusion. Exchange transfusion (remove patient's RBCs while adding donor) is correct."}], 300: [{q: "72yo myeloma (ANC 200), febrile with productive cough, on piperacillin-tazobactam x2 days with no improvement. What is critical next step?", a: "Likely invasive FUNGAL pneumonia. CONTINUE antibiotics but ADD voriconazole (Aspergillus) + high-dose TMP-SMX (PCP coverage)", r: "Severely immunocompromised patients with refractory fever = fungal infection until proven otherwise. Aspergillus and PCP are highest risk organisms."}], 400: [{q: "38yo acute leukemia day 8 post-chemo: dyspnea, chest pain, BP 88/55, troponin 0.28. Diagnosis?", a: "Tumor lysis syndrome with cardiomyopathy/shock", r: "Day 8 post-chemo is peak TLS. K+ release causes hyperkalemia and myocardial irritability. Elevated troponin from hyperkalemia/hypocalcemia damage."}], 500: [{q: "58yo lung cancer stage IV with bone mets: BP 92/54, Na 118, K 5.8. Received 2L NS with no improvement. DUAL problem?", a: "TLS (hyperkalemia) PLUS SIADH (hyponatremia)—restrict fluids, NO more NS", r: "TRAP: Normal saline makes SIADH hyponatremia WORSE. Need fluid restriction for SIADH and K management for TLS."}]
        },
        1: { 100: [{q: "42yo with Crohn's disease (terminal ileum) has Hgb 7.2 (iron def), B12 97, folate 2.1. PRIORITY repletion sequence and WHY?", a: "B12 FIRST or simultaneously with folate. If folate repleted alone, it masks B12 neurologic damage", r: "Folate alone masks B12 neurologic deficiency which can progress to irreversible spinal cord demyelination while B12 remains untreated."}], 200: [{q: "35yo pernicious anemia, day 3 B12 injections: K 2.8, Mg 1.3, weakness. CRITICAL?", a: "REFEEDING SYNDROME—cells import K/Mg intracellularly, SLOW B12, aggressively replele electrolytes", r: "Rapidly correcting severe deficiency stimulates erythropoiesis which demands massive intracellular electrolyte influx, causing acute serum depletion."}], 300: [{q: "58yo pernicious anemia (B12 32), progressive Hgb 6.8, paresthesias. Timeline for neurologic symptoms if untreated?", a: "Symptoms appear 3-6 months, irreversible spinal cord damage if untreated >1 year", r: "B12 deficiency neurologic progression: paresthesias → ataxia → spasticity → irreversible cord disease."}], 400: [{q: "48yo post-gastrectomy 6mo ago: Hgb 6.8, MCV 105, B12 32. Why is gastrectomy significant?", a: "Gastrectomy removes intrinsic factor needed for B12 absorption—lifelong IM B12 required", r: "Parietal cells produce intrinsic factor necessary for B12 absorption. Post-gastrectomy requires monthly B12 injections indefinitely."}], 500: [{q: "76yo with combined iron + B12 + folate deficiency. How does repletion sequence prevent masking?", a: "Iron + folate together normalize Hgb but MASK B12 neurologic deficiency—must include B12 from START", r: "Iron + folate improve Hgb while B12 neurologic damage accelerates silently. B12 MUST be part of initial therapy to prevent irreversible damage."}]
        },
        2: { 100: [{q: "64yo PV (Hct 62%) on hydroxyurea + aspirin presents with sudden severe abdominal pain, vomiting, shock. Labs show elevated LDH, amylase 380. Life-threatening complication?", a: "Thrombotic mesenteric infarction from SMA thrombosis. STAT CT angiography abdomen/pelvis. Cardiothoracic surgery consult", r: "PV hypercoagulability + viscosity causes splenic/mesenteric thrombosis. Mortality >50% even with treatment. Pain out of proportion is key sign."}], 200: [{q: "55yo PV with stroke history, now transient visual loss. Why elevated stroke risk?", a: "PV hypercoagulability + high viscosity + abnormal platelet function", r: "PV has triple thrombotic mechanisms: elevated Hgb/RBCs, abnormal platelets, JAK2 mutation prothrombotic state."}], 300: [{q: "68yo PV on hydroxyurea: new hepatosplenomegaly, Hgb 8.5 (down from 20), retic 8%, LDH 1200. Transformation?", a: "Myelofibrotic transformation—extramedullary hematopoiesis in liver/spleen", r: "~5% PV transform to PMF. Bone marrow fibrosis shifts hematopoiesis to liver/spleen. JAK inhibitors now preferred."}], 400: [{q: "72yo PV refractory thrombocytosis (PLT 900K despite max hydroxyurea) + TIA episodes. Why anagrelide contraindicated?", a: "Anagrelide causes vasodilation + reflex tachycardia—WORSENS thrombotic risk", r: "Anagrelide's PDE3 inhibition causes inappropriate vasodilation with reflex tachycardia. High MI/CVA incidence."}], 500: [{q: "63yo PV developing splenomegaly (15cm), reticulocytes 3%, retic count not improving Hgb. What's happening?", a: "Splenic sequestration from extramedullary hematopoiesis—consider splenectomy", r: "Splenomegaly traps RBCs and WBCs, worsening anemia. Splenectomy can improve Hgb in select patients."}]
        },
        3: { 100: [{q: "58yo in septic shock gets massive transfusion (20 PRBC, 14 FFP, 8 plt). P/F ratio 88, PT >30, Fib 65, temp 32.1°C, pH 6.74. Cascade of complications?", a: "PERFECT STORM: TRALI + massive dilutional coagulopathy + DIC + profound hypothermia + acidosis. STOP transfusion temporarily, INITIATE ECMO", r: "Mortality 50-80%. Multiple catastrophes: TRALI, dilutional coagulopathy, DIC, hypothermia, acidosis. ECMO only adequate solution."}], 200: [{q: "45yo post-op transfused 4 units PRBC: fever 38.9°C, rigors, hypotension, hemoglobinuria. Reaction?", a: "YES—acute hemolytic transfusion reaction from ABO incompatibility", r: "Immediate onset with fever + hemoglobinuria + hypotension. STOP transfusion, aggressive hydration, monitor for AKI/DIC."}], 300: [{q: "38yo post-transfusion (6h ago): urticaria + flushing, fever 37.8°C. BP stable, no hemoglobinuria. Type?", a: "Allergic/anaphylactic transfusion reaction—most common type", r: "~1-2% all transfusions. Immune-mediated against donor proteins. Mild urticaria often manageable with antihistamines."}], 400: [{q: "52yo massive trauma, 28 units PRBC + 18 FFP + 10 platelets: fibrinogen 140, INR 2.2, Hgb 7.2 despite transfusions. Why bleeding continues?", a: "Massive transfusion coagulopathy from dilution + consumption + hypothermia + acidosis", r: "Massive transfusion causes coagulopathy from factor dilution, consumption (DIC), hypothermia dysfunction, acidosis. Balanced 1:1:1 ratio CRITICAL."}], 500: [{q: "68yo post-massive transfusion develops ARDS, coagulopathy, hypothermia. Which complication is INDEPENDENT of transfusion volume?", a: "Transfusion-related acute lung injury (TRALI) can occur with small volumes", r: "TRALI is immune-mediated from donor WBC incompatibility, NOT volume-dependent. Can occur with single unit."}]
        },
        4: { 100: [{q: "64yo SIADH patient on fluid restriction (500mL/day) + vaptans. Admitted with seizures and altered mental status. Na = 98 (acute drop from 120 in hours). PRIORITY?", a: "ACUTE hyponatremia is MORE symptomatic than chronic—HYPERTONIC saline (3%) NOW INDICATED. Correct 4-6 mEq/L per hour until seizures stop", r: "Acute hyponatremia brain hasn't adapted—more symptoms. Hypertonic saline indicated for symptomatic acute hyponatremia despite SIADH diagnosis."}], 200: [{q: "72yo CKD (Cr 3.8) on ACE-I + spironolactone: K 7.4, EKG peaked T-waves, new AKI. PRIORITY?", a: "STOP both drugs, STAT calcium gluconate (cardiac protection), insulin/glucose/bicarb for K shift, urgent dialysis", r: "Triple emergency: cardiac toxicity, AKI, acidosis. ACE-I + spironolactone contraindicated in renal failure."}], 300: [{q: "48yo SIADH (chronic Na 115 x3mo) now receiving demeclocycline. Why correct SLOWLY even though Na is 115?", a: "Chronic hyponatremia brain adapted—RAPID correction causes osmotic demyelination syndrome", r: "Brain reduced osmolytes to compensate. Rapid Na correction causes water shifts out of brain → cell shrinkage → permanent neurologic damage."}], 400: [{q: "36yo sepsis gets 8L NS over 4hr for septic shock: Na now 120 (was 138), Cl 100. Why did Na drop?", a: "Dilutional hyponatremia—sepsis + SIADH make NS hypotonic, switch to 3% saline", r: "Paradox: 'physiologic' NS actually hypotonic in sepsis because SIADH causes free water reabsorption. Need 3% saline."}], 500: [{q: "54yo cirrhosis with ascites, renal failure (Cr 2.8): Na 108 + K 6.8 + HCO3 14 (TRIPLE derangement). Pathophysiology?", a: "Cirrhosis → hepatorenal syndrome + SIADH (Na↓) + metabolic acidosis + hyperkalemia (AKI + aldosterone resistance)", r: "Cirrhosis perfect storm: portal HTN triggers SIADH, renal hypoperfusion causes hyperkalemia + acidosis, aldosterone resistance prevents K excretion."}]
        },
        5: { 100: [{q: "68yo post-CABG day 2: AFib RVR (HR 168), BP 92/58, urine 20mL/hr, altered mental status. Labs: Mg 1.2, K 3.8, chest tube 180mL/hr. PRIORITY?", a: "Aggressive Mg + K replacement IV (Mg FIRST), increase metoprolol IV, address bleeding source (180mL/hr excessive), blood transfusion", r: "Post-op AFib multifactorial: electrolyte depletion + surgical stress + bleeding. Correct Mg/K FIRST—enables beta-blocker effectiveness."}], 200: [{q: "52yo post-op day 3 major abdominal surgery: temp 38.8°C, HR 110, BP low, septic appearance. Concerning timing?", a: "Day 3 post-op fever suggests anastomotic leak/abscess/pneumonia—NOT normal post-op fever", r: "Post-op fever timeline: days 1-2 expected, day 3+ concerning. Needs urgent CT abdomen, blood cultures, surgical evaluation."}], 300: [{q: "71yo post-CABG on metoprolol + amiodarone develops bradycardia (HR 42), hypotension (BP 78/48). Problem?", a: "Amiodarone + metoprolol additive effect causing excessive bradycardia/conduction block", r: "Class III agent + beta-blocker cause excessive AV node slowing. Needs pacing capability."}], 400: [{q: "58yo post-op day 4 from ruptured AAA repair develops acute mesenteric ischemia. Risk factor from surgery?", a: "Suprarenal AAA clamping interrupted SMA flow—reperfusion injury + mural thrombus formation", r: "Ruptured AAA requires suprarenal clamping causing temporary small bowel ischemia. Post-op reperfusion injury increases thrombosis risk."}], 500: [{q: "62yo post-CABG day 5: new respiratory distress, infiltrates on CXR, troponin elevated. Differential includes?", a: "Post-op MI, post-cardiac injury syndrome, infectious endocarditis, graft infection", r: "Day 5 post-CABG with infiltrates + troponin elevation suggests pericarditis (Dressler), acute graft thrombosis, or sternal infection."}]
        },
        6: { 100: [{q: "During induction with succinylcholine + sevoflurane: masseter rigidity, ETCO2 75, temp 38.2°C, dark venous blood. IMMEDIATE next step?", a: "FULMINANT MH with rhabdomyolysis + DIC—ABORT SURGERY immediately, STAT dantrolene 2.5mg/kg IV, aggressive cooling, ICU admission", r: "ETCO2 75 = severe hypermetabolism. Dark blood = myoglobinuria/DIC. Mortality 5-10% even with dantrolene."}], 200: [{q: "MH crisis treated, cooled to 37.2°C, urine clear. CRITICAL post-crisis management?", a: "Dantrolene 1mg/kg IV q4-6h for 24-48h to PREVENT RECRUDESCENCE (occurs 25% of time)", r: "Recrudescence (MH crisis recurs 2-24h post-initial) is common. Requires continued ICU monitoring, watch for compartment syndrome."}], 300: [{q: "Patient family hx MH, scheduled for elective surgery. SAFE anesthetic plan?", a: "Use non-triggering: propofol induction + remifentanil + non-depolarizing paralytic, AVOID succinylcholine + volatiles", r: "Triggering agents: succinylcholine + volatile anesthetics. Safe agents: propofol, remifentanil, non-depolarizing paralytics."}], 400: [{q: "22yo unexplained intraoperative rhabdomyolysis + hyperkalemia during knee arthroscopy (succinylcholine + isoflurane). Genetic testing?", a: "RYR1 gene mutation testing (85% MH cases)—autosomal dominant, 50% family risk", r: "MH = pharmacogenetic from RYR1/CACNA1S mutations causing abnormal calcium release. Genetic testing confirms diagnosis."}], 500: [{q: "Patient with diagnosed RYR1 mutation needs emergency cesarean for preeclampsia. Anesthesia approach?", a: "Spinal anesthesia preferred if stable, if general needed: total IV anesthesia (propofol + remifentanil), NO volatiles/succinylcholine", r: "Regional anesthesia avoids general anesthesia triggers entirely. Total IV anesthesia safe for general. Non-triggering agents mandatory."}]
        }
    },
    1: {
        0: { 100: [{q: "65yo on warfarin develops acute SDH from fall, INR 4.2, needs urgent craniotomy. Emergent reversal?", a: "FFP 3-4 units STAT + Vitamin K 10mg IV, minimize fluid volume (head injury + SIADH risk)", r: "URGENT reversal BUT head injury = SIADH risk from fluid overload. Strategy: FFP (minimal volume), Vitamin K, PCC preferred."}], 200: [{q: "48yo TTP (ADAMTS13 <10%, schistocytes), day 3 plasma exchange: Plt 25K (unchanged). Treatment-resistant?", a: "Switch to cyto-poor FFP or SD-plasma, ADD rituximab (anti-CD20), consider eculizumab", r: "~10-20% TTP refractory to PE. FFP contamination may worsen. Rituximab targets B-cells. Need complement inhibitor for variant."}], 300: [{q: "55yo trauma, hemorrhagic shock, massive transfusion: coma, fixed pupils, core temp 32.8°C, K 7.8, pH 6.88. IMMEDIATE?", a: "Severe hypothermia—STOP resuscitation temporarily, INITIATE EXTRACORPOREAL REWARMING (ECMO)", r: "Core temp 32.8°C mimics death but patient can survive with ECMO. Hypothermia ↓metabolic rate 50% per °C → medications ineffective."}], 400: [{q: "42yo AIHA (Hgb 6.8, DAT+, day 7 prednisone), started rituximab. Highest risk complication?", a: "Rituximab infusion reaction + ongoing hemolysis → severe cytokine release/storm", r: "Rituximab massive B-cell lysis → cytokine release. In AIHA with active hemolysis = already elevated cytokines. Risk of DIRE reaction."}], 500: [{q: "52yo post-MI on clopidogrel + aspirin: sudden severe epistaxis, BP 85/50, platelets 18K. Etiology?", a: "Drug-induced immune thrombocytopenia (DITP); HOLD both, give platelet transfusion x2 (ESSENTIAL in active hemorrhage)", r: "Rapid thrombocytopenia on dual antiplatelet = DITP. Active hemorrhage requires platelet transfusion despite usual DITP avoidance."}]
        },
        1: { 100: [{q: "34yo sickle cell, new fever + chest pain + infiltrate. ACS confirmed. Management?", a: "Blood exchange transfusion (NOT simple transfusion) to reduce HgbS <30%", r: "Simple transfusion WORSENS by increasing viscosity. Exchange transfusion removes RBCs while adding donor RBCs."}], 200: [{q: "28yo pernicious anemia (B12 85, MCV 110, paresthesias), started B12. Why watch for refeeding syndrome?", a: "Rapid B12 correction → erythropoiesis → massive K+/Mg/PO4 intracellular influx → acute serum depletion", r: "Severely deficient patients: cells begin biosynthesis requiring massive electrolyte influx. Risk sudden cardiac death."}], 300: [{q: "56yo Crohn's triple deficiency (iron + B12 + folate). Started iron + folate only. Consequence?", a: "Iron + folate normalize RBC but MASK progressive B12 neurologic deficiency → demyelination silently progresses", r: "Improved Hgb falsely reassures while B12 spinal cord demyelination continues. Irreversible if B12 not included."}], 400: [{q: "48yo post-gastrectomy 6mo ago, progressive paresthesias despite anemia treatment. What's likely missed?", a: "B12 deficiency with spinal cord demyelination—check B12 levels immediately", r: "Post-gastrectomy removes intrinsic factor → B12 malabsorption. Neurologic B12 damage progresses to irreversible spinal cord pathology."}], 500: [{q: "72yo cirrhosis + malnutrition now with combined deficiencies. Why iron supplementation makes it WORSE?", a: "Iron worsens intestinal inflammation → bacterial overgrowth → portal endotoxemia → hepatic encephalopathy", r: "Cirrhosis patients: portal HTN + bacterial overgrowth. Iron worsens dysbiosis. B12/folate first, iron only after GI stabilization."}]
        },
        2: { 100: [{q: "60yo PV (Hct 65%) despite aspirin + hydroxyurea: calf pain + swelling. DVT confirmed. Management paradox?", a: "Anticoagulation + phlebotomy (Hct <45%) + consider IFN-α or ruxolitinib instead of hydroxyurea", r: "PV thrombosis despite treatment suggests need for aggressive disease control with stronger agents."}], 200: [{q: "58yo PV (Hct 61%) with pruritus + erythromelalgia (red painful hands/feet). Mechanism?", a: "Platelet dysfunction + microvascular thrombosis from PV hypercoagulability", r: "Erythromelalgia in PV = thrombotic microvascular involvement. Aspirin helpful, aggressive phlebotomy needed."}], 300: [{q: "70yo PV on hydroxyurea develops hepatosplenomegaly + fever + abdominal pain. Bone marrow fibrosis found. Transformation?", a: "Myelofibrotic transformation (PV → primary myelofibrosis)", r: "~5% PV transform to PMF. Bone marrow fibrosis → extramedullary hematopoiesis. JAK inhibitors first-line for transformed."}], 400: [{q: "65yo PV with recurrent TIA despite aspirin + warfarin. Platelets 680K. Next?", a: "Anagrelide ineffective (worsens thrombotic risk)—switch to interferon-alpha or ruxolitinib", r: "Anagrelide causes reflex tachycardia = prothrombotic. Better: INF-α (fewer effects), ruxolitinib (JAK inhibitor)."}], 500: [{q: "72yo PV on IFN-α (well-controlled) develops dyspnea + right chest pain. Complication?", a: "Pulmonary hypertension from PV + INF-α cardiotoxicity OR thrombotic pulmonary embolism", r: "INF-α can cause cardiomyopathy. PV increases PH risk. Needs echo, CT PE protocol, troponin, BNP."}]
        },

const CATEGORIES = ['Hematology', 'Anemias', 'Polycythemia', 'Transfusion', 'Electrolytes', 'Perioperative', 'Malignant Hyperthermia'];

let scores = [0, 0];
let currentBoard = 0;
let answered = new Set();
let currentQuestion = null;

function showModal(game, cat, val) {
    if (!QUESTIONS[game][cat][val]) return;
    const q = QUESTIONS[game][cat][val][0];
    currentQuestion = {game, cat, val, data: q};

    document.getElementById('modal-title').textContent = CATEGORIES[cat] + ' - $' + val;
    document.getElementById('modal-question').textContent = 'Q: ' + q.q;
    document.getElementById('answer').textContent = '';
    document.getElementById('rationale').textContent = '';
    document.getElementById('ans-section').classList.remove('show');

    document.getElementById('modal').classList.add('show');
}

function revealAns() {
    if (!currentQuestion) return;
    const d = currentQuestion.data;
    document.getElementById('answer').textContent = d.a || 'No answer';
    document.getElementById('rationale').textContent = d.r || 'No rationale';
    document.getElementById('ans-section').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    if (currentQuestion) {
        answered.add(currentQuestion.game + '-' + currentQuestion.cat + '-' + currentQuestion.val);
        renderBoard(currentBoard);
    }
}

function switchBoard(b) {
    document.querySelectorAll('.board').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));

    document.getElementById('board-' + b).classList.add('active');
    document.querySelectorAll('.tab-btn')[b].classList.add('active');
    currentBoard = b;
    renderBoard(b);
}

function renderBoard(gameNum) {
    const board = document.getElementById('board-' + gameNum);
    board.innerHTML = '';

    CATEGORIES.forEach((cat, ci) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        const header = document.createElement('div');
        header.className = 'cat-header';
        header.textContent = cat;
        catDiv.appendChild(header);

        const cluesDiv = document.createElement('div');
        cluesDiv.className = 'clues';

        [100, 200, 300, 400, 500].forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'clue';
            const id = gameNum + '-' + ci + '-' + val;

            if (answered.has(id)) {
                btn.textContent = '✓';
                btn.className += ' answered';
                btn.disabled = true;
            } else {
                btn.textContent = '$' + val;
                btn.onclick = () => showModal(gameNum, ci, val);
            }
            cluesDiv.appendChild(btn);
        });

        catDiv.appendChild(cluesDiv);
        board.appendChild(catDiv);
    });
}

function addPts(p, amt) {
    scores[p-1] += amt;
    document.getElementById('p' + p).textContent = scores[p-1];
}

function resetAll() {
    if (confirm('Reset all?')) {
        scores = [0, 0];
        answered.clear();
        document.getElementById('p1').textContent = '0';
        document.getElementById('p2').textContent = '0';
        document.getElementById('modal').classList.remove('show');
        renderBoard(currentBoard);
    }
}

renderBoard(0);
renderBoard(1);
renderBoard(2);
