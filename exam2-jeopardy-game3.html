<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUR334 Exam 2 Jeopardy - Game 3 - NCLEX-NGN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #ffffff;
            --accent-blue: #0f3460;
            --accent-gold: #e94560;
            --button-hover: #528aff;
        }
        body.light-theme {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #1a1a1a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { background: linear-gradient(135deg, var(--accent-blue), var(--accent-gold)); padding: 20px; text-align: center; }
        header h1 { font-size: 2.5em; margin-bottom: 5px; }
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--bg-secondary); gap: 10px; flex-wrap: wrap; }
        .theme-toggle { background-color: var(--accent-blue); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .theme-toggle:hover { background-color: var(--button-hover); }
        .scores { display: flex; gap: 30px; font-size: 1.1em; font-weight: bold; }
        .score-value { color: var(--accent-gold); font-size: 1.3em; }
        .game-container { flex: 1; padding: 30px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .category { background-color: var(--accent-blue); border: 3px solid var(--accent-gold); border-radius: 8px; padding: 15px; text-align: center; }
        .category-name { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .points-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .point-cell { background-color: var(--accent-gold); color: #000; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .point-cell:hover:not(.answered) { transform: scale(1.05); box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4); }
        .point-cell.answered { background-color: #666; color: #999; cursor: not-allowed; opacity: 0.6; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); }
        .modal-content { background-color: var(--bg-primary); margin: 5% auto; padding: 30px; border: 3px solid var(--accent-gold); border-radius: 10px; width: 90%; max-width: 900px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 15px; }
        .modal-title { font-size: 1.3em; font-weight: bold; color: var(--accent-gold); }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--accent-gold); }
        .question-section { margin-bottom: 25px; }
        .section-label { font-size: 0.9em; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; color: var(--accent-gold); }
        .question-text { background-color: var(--bg-secondary); padding: 15px; border-radius: 6px; font-size: 0.95em; line-height: 1.6; margin-bottom: 10px; }
        .answer-text { background-color: var(--accent-gold); color: #000; padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; line-height: 1.6; font-size: 0.95em; }
        .rationale-text { background-color: var(--bg-secondary); padding: 15px; border-radius: 6px; border-left: 4px solid var(--accent-gold); font-style: italic; line-height: 1.6; font-size: 0.9em; }
        .score-display { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .score-btn { background-color: var(--accent-blue); color: white; border: 2px solid var(--accent-gold); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .score-btn:hover { background-color: var(--button-hover); }
        .close-modal-btn { background-color: var(--accent-blue); color: white; border: 2px solid var(--accent-gold); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>🎯 NUR334 Exam 2 Jeopardy — Game 3</h1>
        <p>NCLEX-NGN Clinical Judgment - EXTREMELY HIGH-YIELD</p>
    </header>

    <div class="controls">
        <div class="scores">
            <div><span>Player 1:</span> <span class="score-value" id="player1Score">0</span></div>
            <div><span>Player 2:</span> <span class="score-value" id="player2Score">0</span></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark/Light</button>
    </div>

    <div class="game-container">
        <div id="gameBoard"></div>
    </div>

    <div id="questionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Question</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="question-section">
                <div class="section-label">Question</div>
                <div class="question-text" id="questionText"></div>
            </div>
            <div class="question-section">
                <div class="section-label">Answer</div>
                <div class="answer-text" id="answerText"></div>
                <div class="section-label">Rationale</div>
                <div class="rationale-text" id="rationaleText"></div>
            </div>
            <div class="score-display">
                <button class="score-btn" onclick="awardPoints(1)">Player 1 Correct</button>
                <button class="score-btn" onclick="awardPoints(2)">Player 2 Correct</button>
                <button class="score-btn" onclick="skipQuestion()">Skip</button>
            </div>
            <button class="close-modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="exam2-jeopardy-game3.js"></script>
    <script>
        let player1Score = 0;
        let player2Score = 0;
        let answeredClues = new Set();
        let currentCategory = null;
        let currentPoints = null;

        function initializeGame() {
            loadScores();
            loadAnsweredClues();
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'categories-grid';

            Object.keys(JEOPARDY_EXAM2_GAME3.categories).forEach(idx => {
                const category = JEOPARDY_EXAM2_GAME3.categories[idx];
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'category-name';
                nameDiv.textContent = category.name;
                categoryDiv.appendChild(nameDiv);
                const pointsGridDiv = document.createElement('div');
                pointsGridDiv.className = 'points-grid';
                [100, 200, 300, 400, 500].forEach(points => {
                    if (category.clues[points] && category.clues[points].length > 0) {
                        const clueKey = category.id + '-' + points;
                        const cellDiv = document.createElement('div');
                        cellDiv.className = 'point-cell';
                        cellDiv.textContent = points + ' pts';
                        if (answeredClues.has(clueKey)) {
                            cellDiv.classList.add('answered');
                        } else {
                            cellDiv.onclick = () => openQuestion(idx, points);
                        }
                        pointsGridDiv.appendChild(cellDiv);
                    }
                });
                categoryDiv.appendChild(pointsGridDiv);
                grid.appendChild(categoryDiv);
            });
            board.appendChild(grid);
        }

        function openQuestion(categoryIdx, points) {
            const category = JEOPARDY_EXAM2_GAME3.categories[categoryIdx];
            currentCategory = category.id;
            currentPoints = points;
            const clues = category.clues[points];
            if (!clues || clues.length === 0) return;
            const clue = clues[0]; // Only one clue per category/points in game files
            document.getElementById('modalTitle').textContent = category.name + ' - ' + points + ' pts';
            document.getElementById('questionText').textContent = clue.q;
            document.getElementById('answerText').textContent = clue.a;
            document.getElementById('rationaleText').textContent = clue.rationale;
            document.getElementById('questionModal').style.display = 'block';
        }

        function awardPoints(player) {
            if (player === 1) player1Score += currentPoints;
            else player2Score += currentPoints;
            markClueAnswered();
            saveScores();
            updateScoreDisplay();
            closeModal();
        }

        function skipQuestion() {
            markClueAnswered();
            closeModal();
        }

        function markClueAnswered() {
            answeredClues.add(currentCategory + '-' + currentPoints);
            saveAnsweredClues();
            renderBoard();
        }

        function closeModal() {
            document.getElementById('questionModal').style.display = 'none';
            currentCategory = null;
            currentPoints = null;
        }

        function updateScoreDisplay() {
            document.getElementById('player1Score').textContent = player1Score;
            document.getElementById('player2Score').textContent = player2Score;
        }

        function saveScores() {
            localStorage.setItem('exam2-game3-scores-1', player1Score.toString());
            localStorage.setItem('exam2-game3-scores-2', player2Score.toString());
        }

        function loadScores() {
            player1Score = parseInt(localStorage.getItem('exam2-game3-scores-1') || '0');
            player2Score = parseInt(localStorage.getItem('exam2-game3-scores-2') || '0');
            updateScoreDisplay();
        }

        function saveAnsweredClues() {
            localStorage.setItem('exam2-game3-answered-clues', JSON.stringify(Array.from(answeredClues)));
        }

        function loadAnsweredClues() {
            const saved = localStorage.getItem('exam2-game3-answered-clues');
            if (saved) answeredClues = new Set(JSON.parse(saved));
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('exam2-game3-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('questionModal')) closeModal();
        };

        window.addEventListener('load', function() {
            if (localStorage.getItem('exam2-game3-theme') === 'light') document.body.classList.add('light-theme');
            initializeGame();
        });
    </script>
</body>
</html>
