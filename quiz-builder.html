<!DOCTYPE html>
<!-- ============================================================
     BUILD YOUR OWN EXAM

     This page is a shell. assets/quiz.js reads data/quiz-bank.js and
     renders a topic x question-set table into #quiz-select; on Start
     it assembles the checked cells, shuffles them, sets
     window.EXAM_DATA, and injects assets/exam.js into #exam-root.

     You will almost never edit this file. You edit data/quiz-bank.js.

     Note the script ORDER: the data file must load before quiz.js.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Own Exam — Study Guide</title>
<script>(function(){try{var p=new URLSearchParams(location.search).get('theme');var t=p||localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(p){try{localStorage.setItem('theme',p)}catch(e){}}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="assets/styles.css?v=20260913">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<main id="content">
<div class="page-inner">

  <header class="page-head">
    <p class="eyebrow">Exam Prep</p>
    <h1>Build Your Own Exam</h1>
  </header>

  <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
    <h2 style="margin: 0; flex: 1;"></h2>
    <details class="jeopardy-dropdown">
      <summary class="jeopardy-summary">🎮 Exam 2 Jeopardy Games</summary>
      <div class="dropdown-menu">
        <a href="exam2-jeopardy-game1.html" class="dropdown-item">Game 1</a>
        <a href="exam2-jeopardy-game2.html" class="dropdown-item">Game 2</a>
        <a href="exam2-jeopardy-game3.html" class="dropdown-item">Game 3</a>
      </div>
    </details>
  </div>

  <div id="quiz-select"></div>
  <div id="exam-root"></div>

  <nav class="page-flip" data-page-flip></nav>
  <footer class="site-foot">Built from the course lecture material — for personal study use.</footer>

</div>
</main>

<script src="data/quiz-bank.js?v=20260913"></script>
<script src="data/week2-questions.js?v=20260913"></script>
<script src="data/week3-questions.js?v=20260913"></script>
<script>
(function() {
  // IDs of old topics to remove from quiz-bank
  const oldTopicIds = [
    'hematology-labs-dx',
    'anemias-polycythemia',
    'blood-component-therapy',
    'central-venous-catheters',
    'electrolyte-imbalances',
    'fluid-management',
    'preoperative-nursing',
    'intraoperative-nursing',
    'postoperative-nursing'
  ];

  // Remove old duplicate topics from quiz-bank
  if (window.QUIZ_BANK && window.QUIZ_BANK.topics) {
    window.QUIZ_BANK.topics = window.QUIZ_BANK.topics.filter(t => !oldTopicIds.includes(t.id));
  }

  // Process Week 2 questions
  if (window.EXAM_DATA_WEEK2 && window.EXAM_DATA_WEEK2.questions && window.QUIZ_BANK) {
    // Remove any existing week2- prefixed topics
    window.QUIZ_BANK.topics = window.QUIZ_BANK.topics.filter(t => !t.id.startsWith('week2-'));

    // Group questions by topic
    const topicGroups2 = {};
    window.EXAM_DATA_WEEK2.questions.forEach(q => {
      const topic = q.topic || 'Week 2';
      if (!topicGroups2[topic]) topicGroups2[topic] = [];
      topicGroups2[topic].push({
        stem: q.stem,
        options: q.options,
        answer: q.answer,
        rationale: q.rationale,
        topic: q.topic,
        source: "quiz-bank"
      });
    });

    // Add grouped questions to QUIZ_BANK as new topics
    Object.keys(topicGroups2).sort().forEach(topicName => {
      const topicId = 'week2-' + topicName.toLowerCase().replace(/\s+/g, '-');
      window.QUIZ_BANK.topics.push({
        id: topicId,
        label: topicName,
        week: 2,
        sets: {
          mustKnow: topicGroups2[topicName],
          extraPractice: [],
          eaq: []
        }
      });
    });

    console.log('Week 2 questions loaded: ' + window.EXAM_DATA_WEEK2.questions.length + ' questions in ' + Object.keys(topicGroups2).length + ' topics');
  }

  // Process Week 3 questions
  if (window.EXAM_DATA_WEEK3 && window.EXAM_DATA_WEEK3.questions && window.QUIZ_BANK) {
    // Remove any existing week3- prefixed topics
    window.QUIZ_BANK.topics = window.QUIZ_BANK.topics.filter(t => !t.id.startsWith('week3-'));

    // Group questions by topic
    const topicGroups3 = {};
    window.EXAM_DATA_WEEK3.questions.forEach(q => {
      const topic = q.topic || 'Week 3';
      if (!topicGroups3[topic]) topicGroups3[topic] = [];
      topicGroups3[topic].push({
        stem: q.stem,
        options: q.options,
        answer: q.answer,
        rationale: q.rationale,
        topic: q.topic,
        source: "quiz-bank"
      });
    });

    // Add grouped questions to QUIZ_BANK as new topics
    Object.keys(topicGroups3).sort().forEach(topicName => {
      const topicId = 'week3-' + topicName.toLowerCase().replace(/\s+/g, '-');
      window.QUIZ_BANK.topics.push({
        id: topicId,
        label: topicName,
        week: 3,
        sets: {
          mustKnow: topicGroups3[topicName],
          extraPractice: [],
          eaq: []
        }
      });
    });

    console.log('Week 3 questions loaded: ' + window.EXAM_DATA_WEEK3.questions.length + ' questions in ' + Object.keys(topicGroups3).length + ' topics');
  }
})();

</script>
<script src="assets/site.js?v=20260913"></script>
<script src="assets/quiz.js?v=20260913"></script>
</body>
</html>
